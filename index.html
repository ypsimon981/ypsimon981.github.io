<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#090909">
<title>CoDriver</title>
<style>
:root{
  --bg:#090909;
  --panel:#171717;
  --panel2:#222;
  --line:#343434;
  --text:#f7f7f7;
  --muted:#8c8c8c;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;
}
body{min-height:100dvh}
a,button{-webkit-tap-highlight-color:transparent}
button{font:inherit}
.page{
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
}
.shell{
  width:min(760px,100%);
  padding:28px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:30px;
  box-shadow:0 22px 70px rgba(0,0,0,.35);
}
.brand{
  font-size:14px;
  font-weight:850;
  letter-spacing:.16em;
  color:#a8a8a8;
  margin-bottom:8px;
}
h1{
  margin:0;
  font-size:clamp(40px,7vw,64px);
  line-height:1;
  letter-spacing:-.04em;
}
.sub{
  margin:10px 0 26px;
  color:var(--muted);
  font-size:16px;
}
.topGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.tile,
.signTile,
.monitorTile,
.translateTile{
  border:1px solid #3a3a3a;
  background:var(--panel2);
  color:#fff;
  text-decoration:none;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:default;
  user-select:none;
}
.tile{
  aspect-ratio:1/1;
  flex-direction:column;
  gap:12px;
  min-height:120px;
}
.iconBadge{
  width:82px;
  height:82px;
  border-radius:20px;
  background:#d9ddda;
  display:grid;
  place-items:center;
  overflow:hidden;
  flex:0 0 auto;
}
.icon{
  width:48px;
  height:48px;
  display:block;
  color:#3d3d3d;
  fill:currentColor;
  stroke:none;
  filter:drop-shadow(11px 11px 0 rgba(0,0,0,.11));
}
.label{
  font-size:17px;
  font-weight:800;
}
.signTile{
  margin-top:14px;
  min-height:128px;
  flex-direction:column;
  gap:4px;
  background:#fff;
  color:#080808;
  border-color:#fff;
  cursor:pointer;
  transition:transform .12s ease,opacity .12s ease;
}
.signTile:active{transform:scale(.99);opacity:.92}
.signBig{
  font-size:clamp(44px,8vw,72px);
  font-weight:950;
  letter-spacing:.08em;
  line-height:.95;
}
.signSub{
  margin-top:8px;
  font-size:13px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
  opacity:.55;
}
.bottomGrid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
  margin-top:14px;
}
.monitorTile{
  min-height:112px;
  justify-content:flex-start;
  padding:0 24px;
  gap:15px;
}
.translateTile{
  min-height:112px;
  flex-direction:column;
  gap:8px;
}
.monitorTile .iconBadge{width:70px;height:70px;border-radius:17px}
.monitorTile .icon{width:40px;height:40px}
.translateTile .iconBadge{width:64px;height:64px;border-radius:16px}
.translateTile .icon{width:36px;height:36px}
.monitorTitle,.translateTitle{
  font-size:19px;
  font-weight:850;
}
.monitorMeta{
  display:block;
  margin-top:3px;
  color:#858585;
  font-size:12px;
  font-weight:650;
}
.inactive{
  cursor:default;
}
.inactive:active{transform:none}
.footer{
  margin-top:22px;
  font-size:11px;
  color:#666;
  text-align:center;
  letter-spacing:.08em;
}
svg{display:block}
@media(max-width:600px){
  .page{padding:14px}
  .shell{padding:20px 16px;border-radius:24px}
  .tile{min-height:104px;border-radius:18px}
  .iconBadge{width:70px;height:70px;border-radius:17px}
  .icon{width:42px;height:42px}
  .label{font-size:15px}
  .signTile{min-height:112px;border-radius:20px}
  .bottomGrid{grid-template-columns:1.65fr 1fr}
  .monitorTile,.translateTile{min-height:96px;border-radius:18px}
  .monitorTile{padding:0 16px}
  .monitorTitle,.translateTitle{font-size:16px}
}
</style>
</head>
<body>
<main class="page">
  <section class="shell">
    <div class="brand">CODRIVER</div>
    <h1>Driver tools</h1>
    <p class="sub">Gli strumenti essenziali per il lavoro NCC, in un solo posto.</p>

    <div class="topGrid">
      <button class="tile inactive" type="button" aria-disabled="true">
        <span class="iconBadge" aria-hidden="true">
          <svg class="icon" viewBox="0 0 64 64">
            <path d="M8 39h16l12-9 8-17c1-3 4-5 7-5 2 0 4 2 3 5l-5 17 8 7c2 2 2 4 0 5l-4 3-12-5-8 7-1 8-4 3-4-13H8z"/>
            <rect x="8" y="52" width="48" height="5" rx="2.5"/>
          </svg>
        </span>
        <span class="label">Voli</span>
      </button>

      <button class="tile inactive" type="button" aria-disabled="true">
        <span class="iconBadge" aria-hidden="true">
          <svg class="icon" viewBox="0 0 64 64">
            <path d="M17 8h30c5 0 9 4 9 9v27c0 6-5 11-11 11H19C13 55 8 50 8 44V17c0-5 4-9 9-9zm1 8v14h28V16H18zm2 23a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm24 0a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/>
            <path d="M16 54h8l-5 8h-8zm32 0h-8l5 8h8z"/>
          </svg>
        </span>
        <span class="label">Treni</span>
      </button>

      <button class="tile inactive" type="button" aria-disabled="true">
        <span class="iconBadge" aria-hidden="true">
          <svg class="icon" viewBox="0 0 64 64">
            <path d="M27 5h10v8h9v8h6v19H12V21h6v-8h9V5zm-5 16v15h20V21H22z"/>
            <path d="M6 39h52l-6 13c-3 6-8 8-15 6l-5-2-5 2c-7 2-12 0-15-6L6 39z"/>
            <path d="M5 58c5-4 9-4 14 0 5 4 9 4 14 0 5-4 9-4 14 0 4 3 8 3 12 1v5H5z"/>
          </svg>
        </span>
        <span class="label">Navi</span>
      </button>
    </div>

    <a class="signTile" href="cartello.html">
      <span class="signBig">SIGN</span>
      <span class="signSub">Cartello passeggero</span>
    </a>

    <div class="bottomGrid">
      <button class="monitorTile inactive" type="button" aria-disabled="true">
        <span class="iconBadge" aria-hidden="true">
          <svg class="icon" viewBox="0 0 64 64">
            <rect x="7" y="10" width="50" height="39" rx="5"/>
            <rect x="13" y="16" width="8" height="25" rx="2"/>
            <rect x="27" y="23" width="8" height="18" rx="2"/>
            <rect x="41" y="14" width="8" height="27" rx="2"/>
            <rect x="24" y="51" width="16" height="5" rx="2"/>
          </svg>
        </span>
        <span>
          <span class="monitorTitle">Monitor</span>
          <span class="monitorMeta">Voli · Treni · Navi</span>
        </span>
      </button>

      <button class="translateTile inactive" type="button" aria-disabled="true">
        <span class="iconBadge" aria-hidden="true">
          <svg class="icon" viewBox="0 0 64 64">
            <path d="M7 9h31v27H21L10 45V36H7z"/>
            <path d="M27 27h30v24h-8v8l-10-8H27z"/>
            <path d="M14 16h17v4h-6c-1 4-3 7-6 10l-3-3c2-2 4-4 5-7h-7zm6-4h5v4h-5z"/>
            <path d="M37 33h6l8 14h-6l-1-3h-8l-1 3h-6zm1 7h4l-2-5z"/>
          </svg>
        </span>
        <span class="translateTitle">Traduttore</span>
      </button>
    </div>

    <div class="footer">MAINPAGE · V1.2</div>
  </section>
</main>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#090909">
<title>CoDriver</title>
<style>
:root{
  --bg:#090909;
  --panel:#171717;
  --panel2:#222;
  --line:#343434;
  --text:#f7f7f7;
  --muted:#8c8c8c;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;
}
body{min-height:100dvh}
a,button{-webkit-tap-highlight-color:transparent}
button{font:inherit}
.page{
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
}
.shell{
  width:min(760px,100%);
  padding:28px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:30px;
  box-shadow:0 22px 70px rgba(0,0,0,.35);
}
.brand{
  font-size:14px;
  font-weight:850;
  letter-spacing:.16em;
  color:#a8a8a8;
  margin-bottom:8px;
}
h1{
  margin:0;
  font-size:clamp(40px,7vw,64px);
  line-height:1;
  letter-spacing:-.04em;
}
.sub{
  margin:10px 0 26px;
  color:var(--muted);
  font-size:16px;
}
.topGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.tile,
.signTile,
.monitorTile,
.translateTile{
  border:1px solid #3a3a3a;
  background:var(--panel2);
  color:#fff;
  text-decoration:none;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:default;
  user-select:none;
}
.tile{
  aspect-ratio:1/1;
  flex-direction:column;
  gap:12px;
  min-height:120px;
}
.icon{
  width:44px;
  height:44px;
  display:block;
}
.label{
  font-size:17px;
  font-weight:800;
}
.signTile{
  margin-top:14px;
  min-height:128px;
  flex-direction:column;
  gap:4px;
  background:#fff;
  color:#080808;
  border-color:#fff;
  cursor:pointer;
  transition:transform .12s ease,opacity .12s ease;
}
.signTile:active{transform:scale(.99);opacity:.92}
.signBig{
  font-size:clamp(44px,8vw,72px);
  font-weight:950;
  letter-spacing:.08em;
  line-height:.95;
}
.signSub{
  margin-top:8px;
  font-size:13px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
  opacity:.55;
}
.bottomGrid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
  margin-top:14px;
}
.monitorTile{
  min-height:112px;
  justify-content:flex-start;
  padding:0 24px;
  gap:15px;
}
.translateTile{
  min-height:112px;
  flex-direction:column;
  gap:8px;
}
.monitorTitle,.translateTitle{
  font-size:19px;
  font-weight:850;
}
.monitorMeta{
  display:block;
  margin-top:3px;
  color:#858585;
  font-size:12px;
  font-weight:650;
}
.inactive{
  cursor:default;
}
.inactive:active{transform:none}
.footer{
  margin-top:22px;
  font-size:11px;
  color:#666;
  text-align:center;
  letter-spacing:.08em;
}
svg{
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
@media(max-width:600px){
  .page{padding:14px}
  .shell{padding:20px 16px;border-radius:24px}
  .tile{min-height:104px;border-radius:18px}
  .icon{width:38px;height:38px}
  .label{font-size:15px}
  .signTile{min-height:112px;border-radius:20px}
  .bottomGrid{grid-template-columns:1.65fr 1fr}
  .monitorTile,.translateTile{min-height:96px;border-radius:18px}
  .monitorTile{padding:0 16px}
  .monitorTitle,.translateTitle{font-size:16px}
}
</style>
</head>
<body>
<main class="page">
  <section class="shell">
    <div class="brand">CODRIVER</div>
    <h1>Driver tools</h1>
    <p class="sub">Gli strumenti essenziali per il lavoro NCC, in un solo posto.</p>

    <div class="topGrid">
      <button class="tile inactive" type="button" aria-disabled="true">
        <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M6 27l36-12-9 11 9 7-36 3 9-9z"/>
          <path d="M19 20l-4-8"/>
          <path d="M26 30l-1 8"/>
        </svg>
        <span class="label">Voli</span>
      </button>

      <button class="tile inactive" type="button" aria-disabled="true">
        <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="12" y="7" width="24" height="29" rx="5"/>
          <path d="M16 31h16M17 13h14M16 20h16"/>
          <circle cx="18" cy="33" r="2"/>
          <circle cx="30" cy="33" r="2"/>
          <path d="M15 40l5-4M33 40l-5-4"/>
        </svg>
        <span class="label">Treni</span>
      </button>

      <button class="tile inactive" type="button" aria-disabled="true">
        <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M8 29h31l-5 7H15z"/>
          <path d="M17 29V15h13l5 14"/>
          <path d="M21 15V9h7v6"/>
          <path d="M7 40c3-2 6-2 9 0 3 2 6 2 9 0 3-2 6-2 9 0 3 2 6 2 8 0"/>
        </svg>
        <span class="label">Navi</span>
      </button>
    </div>

    <a class="signTile" href="cartello.html">
      <span class="signBig">SIGN</span>
      <span class="signSub">Cartello passeggero</span>
    </a>

    <div class="bottomGrid">
      <button class="monitorTile inactive" type="button" aria-disabled="true">
        <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M8 37V23M18 37V15M28 37V27M38 37V10"/>
          <path d="M6 40h35"/>
        </svg>
        <span>
          <span class="monitorTitle">Monitor</span>
          <span class="monitorMeta">Voli · Treni · Navi</span>
        </span>
      </button>

      <button class="translateTile inactive" type="button" aria-disabled="true">
        <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M7 11h19v16H15l-7 6V11z"/>
          <path d="M24 21h17v16H31l-6 5"/>
          <path d="M12 17h9M16.5 14v6"/>
          <path d="M30 27l5 8M40 27l-5 8M31.5 32h7"/>
        </svg>
        <span class="translateTitle">Traduttore</span>
      </button>
    </div>

    <div class="footer">MAINPAGE · V1</div>
  </section>
</main>
</body>
</html>

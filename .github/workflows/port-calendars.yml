name: Refresh national port calendars
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: port-calendars
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public calendars
        run: node scripts/refresh-port-calendars.cjs
      - name: Save refreshed calendars
        if: always()
        run: |
          git config user.name 'SteerWill calendars'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ports
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public port calendars'
            git pull --rebase
            git push
          fi

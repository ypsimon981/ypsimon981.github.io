<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0908">
<title>SteerWill · Traduttore</title>
<link rel="icon" type="image/svg+xml" href="assets/steerwill-brush-icon.svg?v=brush20261001">
<style>
:root{
  --bg:#0c0d0f;--panel:#171a1e;--panel2:#1e2227;--line:#30363d;
  --text:#f3f4f5;--muted:#8d949c;--blue:#78aef7;--teal:#73c9b7;--yellow:#f2b426;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}
body{min-height:100dvh}
button,input,select,textarea{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
.page{width:min(860px,100%);margin:0 auto;padding:14px 14px calc(26px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{font-size:13px;font-weight:850;letter-spacing:.15em;color:#aab0b6}
.home{min-height:42px;padding:0 14px;border:1px solid #373d44;border-radius:999px;background:#20242a;color:#fff;text-decoration:none;display:flex;align-items:center;font-size:13px;font-weight:850}
.hero{padding:21px;border:1px solid #30363d;border-radius:24px;background:linear-gradient(180deg,#181c21,#15181c)}
h1{margin:0;font-size:clamp(38px,8vw,62px);line-height:.95;letter-spacing:-.045em}
.sub{margin:8px 0 0;color:#8f969e;font-size:14px;line-height:1.4}
.langRow{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:end;margin-top:18px}
.langField{display:grid;gap:7px}
label,.eyebrow{font-size:10px;color:#7f8790;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
select{width:100%;height:52px;border:1px solid #3a4149;border-radius:15px;background:#101318;color:#fff;padding:0 12px;font-weight:850;outline:none}
.swap{width:52px;height:52px;border:1px solid #3a4149;border-radius:15px;background:#23282e;color:#fff;font-size:20px;font-weight:950}
.composer{margin-top:12px;border:1px solid #343b43;border-radius:20px;background:#111419;overflow:hidden}
textarea{display:block;width:100%;min-height:150px;resize:vertical;border:0;background:transparent;color:#fff;padding:17px;font-size:18px;line-height:1.45;outline:none}
.composerBar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid #2b3036}
.leftActions,.rightActions{display:flex;align-items:center;gap:8px}
.smallBtn{min-height:38px;padding:0 11px;border:1px solid #3a4149;border-radius:12px;background:#22272d;color:#ddd;font-size:11px;font-weight:850}
.smallBtn.mic.active{background:#51302f;border-color:#7d4744;color:#ffd1cf}
.count{font-size:10px;color:#6f777f}
.translateBtn{width:100%;height:56px;margin-top:12px;border:0;border-radius:16px;background:var(--yellow);color:#111;font-weight:950;font-size:16px}
.translateBtn:disabled{opacity:.6}
.error{display:none;margin-top:12px;padding:13px;border:1px solid #573735;border-radius:15px;background:#271817;color:#ffb0ac;font-size:12px}
.error.show{display:block}
.output{display:none;margin-top:15px;border:1px solid #33424a;border-radius:22px;background:linear-gradient(135deg,#172329,#181d22);overflow:hidden}
.output.show{display:block}
.outputHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid #2d383e}
.outputLang{font-size:11px;color:#91a6b2;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.outputActions{display:flex;gap:7px}
.outputText{padding:21px 18px 23px;font-size:clamp(24px,5vw,38px);font-weight:780;line-height:1.22;letter-spacing:-.02em;white-space:pre-wrap}
.provider{padding:0 18px 14px;color:#68747d;font-size:9px}
.quickSection,.historySection{margin-top:18px;padding:17px;border:1px solid #30363d;border-radius:22px;background:#171a1e}
.sectionTitle{font-size:15px;font-weight:900;margin-bottom:11px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.phrase{flex:0 0 auto;max-width:250px;padding:10px 12px;border:1px solid #384048;border-radius:14px;background:#20252a;color:#e8eaec;text-align:left;font-size:12px;font-weight:760;line-height:1.25}
.historyList{display:grid;gap:8px}
.historyItem{padding:12px;border:1px solid #30363d;border-radius:14px;background:#1d2126;cursor:pointer}
.historyTop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.historyLang{font-size:9px;color:#72808a;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.historySource{margin-top:5px;color:#8e969e;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.historyTarget{margin-top:3px;font-size:13px;font-weight:820;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:#70777e;font-size:12px;padding:5px 0}
.fullscreen{display:none;position:fixed;inset:0;z-index:999;background:#090a0b;color:#fff;padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));align-items:center;justify-content:center;text-align:center}
.fullscreen.show{display:flex}
.fullscreenText{font-size:clamp(34px,8vw,72px);font-weight:850;line-height:1.12;max-width:1000px}
.closeFull{position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;width:46px;height:46px;border:1px solid #444;border-radius:50%;background:#1f1f1f;color:#fff;font-size:23px}
@media(max-width:620px){
  .page{padding:12px 12px calc(20px + env(safe-area-inset-bottom))}
  .hero{padding:18px}
  .langRow{grid-template-columns:1fr 48px 1fr}
  .swap{width:48px}
  textarea{min-height:135px;font-size:17px}
  .composerBar{align-items:flex-start}
}
</style>
<link rel="stylesheet" href="assets/steerwill-theme.css?v=1">
<link rel="stylesheet" href="assets/revision.css?v=20260930"><link rel="stylesheet" href="assets/mobile.css?v=20261003-garage-alerts"><script defer src="assets/mobile.js?v=20261003-garage-alerts"></script>
</head>
<body>
<main class="page">
  <div class="topbar">
    <div class="brand">STEERWILL · TRADUTTORE</div>
    <a class="home" href="index.html">← Home</a>
  </div>

  <section class="hero">
    <h1>Traduttore</h1>
    <p class="sub">Per parlare con il cliente senza trasformare un transfer in una lezione di lingue.</p>

    <div class="langRow">
      <div class="langField">
        <label for="fromLang">Da</label>
        <select id="fromLang"></select>
      </div>
      <button id="swapBtn" class="swap" type="button" aria-label="Inverti lingue">⇄</button>
      <div class="langField">
        <label for="toLang">A</label>
        <select id="toLang"></select>
      </div>
    </div>

    <div class="composer">
      <textarea id="sourceText" maxlength="3000" placeholder="Scrivi o detta il testo da tradurre…"></textarea>
      <div class="composerBar">
        <div class="leftActions">
          <button id="micBtn" class="smallBtn mic" type="button">🎙 Dettatura</button>
          <button id="clearBtn" class="smallBtn" type="button">Pulisci</button>
        </div>
        <div class="rightActions">
          <span id="charCount" class="count">0 / 3000</span>
        </div>
      </div>
    </div>

    <button id="translateBtn" class="translateBtn" type="button">Traduci</button>
    <div id="errorBox" class="error"></div>
  </section>

  <section id="output" class="output">
    <div class="outputHead">
      <div id="outputLang" class="outputLang">Traduzione</div>
      <div class="outputActions">
        <button id="speakBtn" class="smallBtn" type="button">🔊 Ascolta</button>
        <button id="bigBtn" class="smallBtn" type="button">Aa Grande</button>
        <button id="copyBtn" class="smallBtn" type="button">Copia</button>
      </div>
    </div>
    <div id="outputText" class="outputText"></div>
    <div id="provider" class="provider"></div>
  </section>

  <section class="quickSection">
    <div class="sectionTitle">Frasi rapide</div>
    <div class="chips">
      <button class="phrase" type="button">Buongiorno, sono il suo autista.</button>
      <button class="phrase" type="button">Sono all'uscita degli arrivi.</button>
      <button class="phrase" type="button">Mi avvisi quando ha ritirato i bagagli.</button>
      <button class="phrase" type="button">La aspetto qui.</button>
      <button class="phrase" type="button">Il veicolo è parcheggiato qui vicino.</button>
      <button class="phrase" type="button">Posso aiutarla con i bagagli?</button>
      <button class="phrase" type="button">Mi segua, per favore.</button>
    </div>
  </section>

  <section class="historySection">
    <div class="sectionTitle">Traduzioni recenti</div>
    <div id="historyList" class="historyList"></div>
  </section>
</main>

<div id="fullscreen" class="fullscreen">
  <button id="closeFull" class="closeFull" type="button">×</button>
  <div id="fullscreenText" class="fullscreenText"></div>
</div>

<script src="flight-config.js?v=steerwill5"></script>
<script>
(function(){
  "use strict";

  var PREF_KEY="codriver_translator_prefs_v1";
  var HISTORY_KEY="codriver_translation_history_v1";

  var languages=[
    ["it","🇮🇹 Italiano","it-IT"],["en","🇬🇧 English","en-US"],["fr","🇫🇷 Français","fr-FR"],
    ["es","🇪🇸 Español","es-ES"],["de","🇩🇪 Deutsch","de-DE"],["pt","🇵🇹 Português","pt-PT"],
    ["nl","🇳🇱 Nederlands","nl-NL"],["pl","🇵🇱 Polski","pl-PL"],["ro","🇷🇴 Română","ro-RO"],
    ["ru","🇷🇺 Русский","ru-RU"],["uk","🇺🇦 Українська","uk-UA"],["ar","🇸🇦 العربية","ar-SA"],
    ["tr","🇹🇷 Türkçe","tr-TR"],["zh-CN","🇨🇳 中文","zh-CN"],["ja","🇯🇵 日本語","ja-JP"],["ko","🇰🇷 한국어","ko-KR"]
  ];

  var fromLang=document.getElementById("fromLang");
  var toLang=document.getElementById("toLang");
  var sourceText=document.getElementById("sourceText");
  var translateBtn=document.getElementById("translateBtn");
  var output=document.getElementById("output");
  var outputText=document.getElementById("outputText");
  var outputLang=document.getElementById("outputLang");
  var provider=document.getElementById("provider");
  var errorBox=document.getElementById("errorBox");
  var charCount=document.getElementById("charCount");
  var micBtn=document.getElementById("micBtn");
  var historyList=document.getElementById("historyList");
  var fullscreen=document.getElementById("fullscreen");
  var fullscreenText=document.getElementById("fullscreenText");
  var recognition=null;
  var listening=false;

  function esc(v){
    return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function decodeEntities(v){
    var t=document.createElement("textarea");
    t.innerHTML=String(v||"");
    return t.value;
  }

  function languageName(code){
    var row=languages.find(function(x){return x[0]===code;});
    return row?row[1]:code;
  }

  function speechCode(code){
    var row=languages.find(function(x){return x[0]===code;});
    return row?row[2]:code;
  }

  function fillLanguages(){
    var opts=languages.map(function(x){return '<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>';}).join("");
    fromLang.innerHTML=opts;
    toLang.innerHTML=opts;

    var prefs={};
    try{prefs=JSON.parse(localStorage.getItem(PREF_KEY)||"{}");}catch(e){}
    fromLang.value=prefs.from||"it";
    toLang.value=prefs.to||"en";
    if(fromLang.value===toLang.value) toLang.value=fromLang.value==="en"?"it":"en";
  }

  function savePrefs(){
    localStorage.setItem(PREF_KEY,JSON.stringify({from:fromLang.value,to:toLang.value}));
  }

  function readHistory(){
    try{
      var items=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");
      return Array.isArray(items)?items:[];
    }catch(e){return [];}
  }

  function addHistory(source,target){
    var items=readHistory();
    items.unshift({
      id:"tr_"+Date.now(),
      at:new Date().toISOString(),
      from:fromLang.value,
      to:toLang.value,
      source:source,
      target:target
    });
    localStorage.setItem(HISTORY_KEY,JSON.stringify(items.slice(0,12)));
    renderHistory();
  }

  function renderHistory(){
    var items=readHistory();
    if(!items.length){
      historyList.innerHTML='<div class="empty">Le ultime traduzioni compariranno qui.</div>';
      return;
    }
    historyList.innerHTML=items.map(function(x){
      return '<article class="historyItem" data-id="'+esc(x.id)+'">'+
        '<div class="historyTop"><div class="historyLang">'+esc(languageName(x.from))+' → '+esc(languageName(x.to))+'</div></div>'+
        '<div class="historySource">'+esc(x.source)+'</div>'+
        '<div class="historyTarget">'+esc(x.target)+'</div>'+
      '</article>';
    }).join("");

    Array.prototype.forEach.call(document.querySelectorAll(".historyItem"),function(el){
      el.onclick=function(){
        var item=readHistory().find(function(x){return x.id===el.getAttribute("data-id");});
        if(!item) return;
        fromLang.value=item.from;
        toLang.value=item.to;
        sourceText.value=item.source;
        outputText.textContent=item.target;
        outputLang.textContent=languageName(item.to);
        provider.textContent="Da cronologia";
        output.classList.add("show");
        updateCount();
        savePrefs();
        window.scrollTo({top:0,behavior:"smooth"});
      };
    });
  }

  function updateCount(){
    charCount.textContent=sourceText.value.length+" / 3000";
  }

  async function translate(){
    var text=sourceText.value.trim();
    if(!text){
      errorBox.textContent="Scrivi qualcosa da tradurre.";
      errorBox.classList.add("show");
      sourceText.focus();
      return;
    }
    if(fromLang.value===toLang.value){
      errorBox.textContent="Scegli due lingue diverse.";
      errorBox.classList.add("show");
      return;
    }

    savePrefs();
    errorBox.classList.remove("show");
    translateBtn.disabled=true;
    translateBtn.textContent="Traduzione…";

    try{
      var api=window.STEERWILL_TRANSLATE_API||window.CODRIVER_TRANSLATE_API||
        "https://bboijzuzhgvfxqrsfatw.supabase.co/functions/v1/translate";
      var res=await fetch(api,{
        method:"POST",
        cache:"no-store",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({text:text,from:fromLang.value,to:toLang.value})
      });
      var data=await res.json().catch(function(){return {};});
      if(!res.ok) throw new Error(data.error||"translate_failed");

      var translated=decodeEntities(data.translated_text||"");
      outputText.textContent=translated;
      outputLang.textContent=languageName(toLang.value);
      provider.textContent="Traduzione online · "+(data.provider||"provider esterno");
      output.classList.add("show");
      addHistory(text,translated);
    }catch(e){
      console.error("SteerWill translate error",e);
      errorBox.textContent="Traduzione non riuscita. Riprova.";
      errorBox.classList.add("show");
    }finally{
      translateBtn.disabled=false;
      translateBtn.textContent="Traduci";
    }
  }

  document.getElementById("swapBtn").onclick=function(){
    var a=fromLang.value;
    fromLang.value=toLang.value;
    toLang.value=a;
    savePrefs();

    if(output.classList.contains("show") && outputText.textContent){
      var original=sourceText.value;
      sourceText.value=outputText.textContent;
      outputText.textContent=original;
      outputLang.textContent=languageName(toLang.value);
      updateCount();
    }
  };

  fromLang.onchange=savePrefs;
  toLang.onchange=savePrefs;
  sourceText.addEventListener("input",updateCount);
  sourceText.addEventListener("keydown",function(e){
    if((e.metaKey||e.ctrlKey) && e.key==="Enter"){e.preventDefault();translate();}
  });
  translateBtn.onclick=translate;

  document.getElementById("clearBtn").onclick=function(){
    sourceText.value="";
    output.classList.remove("show");
    errorBox.classList.remove("show");
    updateCount();
    sourceText.focus();
  };

  document.getElementById("copyBtn").onclick=async function(){
    var text=outputText.textContent;
    if(!text) return;
    try{
      await navigator.clipboard.writeText(text);
      this.textContent="Copiato ✓";
      var btn=this;
      setTimeout(function(){btn.textContent="Copia";},1200);
    }catch(e){}
  };

  document.getElementById("speakBtn").onclick=function(){
    var text=outputText.textContent;
    if(!text || !("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=speechCode(toLang.value);
    speechSynthesis.speak(u);
  };

  document.getElementById("bigBtn").onclick=function(){
    if(!outputText.textContent) return;
    fullscreenText.textContent=outputText.textContent;
    fullscreen.classList.add("show");
  };
  document.getElementById("closeFull").onclick=function(){fullscreen.classList.remove("show");};
  fullscreen.addEventListener("click",function(e){if(e.target===fullscreen) fullscreen.classList.remove("show");});

  Array.prototype.forEach.call(document.querySelectorAll(".phrase"),function(btn){
    btn.onclick=function(){
      fromLang.value="it";
      sourceText.value=btn.textContent.trim();
      updateCount();
      savePrefs();
      translate();
    };
  });

  var SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SpeechRecognition){
    recognition=new SpeechRecognition();
    recognition.interimResults=false;
    recognition.continuous=false;

    recognition.onresult=function(e){
      var transcript="";
      for(var i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) transcript+=e.results[i][0].transcript;
      }
      if(transcript){
        sourceText.value=(sourceText.value?sourceText.value+" ":"")+transcript;
        updateCount();
      }
    };
    recognition.onend=function(){
      listening=false;
      micBtn.classList.remove("active");
      micBtn.textContent="🎙 Dettatura";
    };
    recognition.onerror=function(){
      listening=false;
      micBtn.classList.remove("active");
      micBtn.textContent="🎙 Dettatura";
    };

    micBtn.onclick=function(){
      if(listening){recognition.stop();return;}
      recognition.lang=speechCode(fromLang.value);
      listening=true;
      micBtn.classList.add("active");
      micBtn.textContent="■ Stop";
      try{recognition.start();}catch(e){}
    };
  }else{
    micBtn.style.display="none";
  }

  fillLanguages();
  updateCount();
  renderHistory();
})();
</script>
</body>
</html>

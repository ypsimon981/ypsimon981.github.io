<style>
.driverHome{width:min(780px,100%);margin:0 auto;padding:16px 14px 112px}.driverIntro{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:2px 2px 12px}.driverIntro strong{font-size:18px;letter-spacing:-.02em}.driverIntro span{color:#817a75;font-size:10px}.driverSection{margin-top:12px}.driverSectionTitle{margin:0 0 9px;color:#9ea4aa;font-size:11px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}
.driverCard{display:flex;color:#f5f1ec;text-decoration:none;border:1px solid #3a3f44;background:#202428;border-radius:20px;overflow:hidden}.driverHero{min-height:122px;padding:17px 18px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#4a3025 0%,#2b211d 100%);border-color:#6f4a39}.driverHeroCopy{display:grid;gap:5px}.driverEyebrow{color:#b99b89;font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.driverHeroTitle{font-size:38px;font-weight:950;line-height:.9;letter-spacing:-.04em}.driverHeroIcon{width:58px;height:58px;flex:0 0 58px;border:1px solid rgba(255,255,255,.18);border-radius:18px;display:grid;place-items:center;color:#dca06e}.driverHeroIcon svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.trackerBox{padding:13px;border:1px solid #363b40;border-radius:20px;background:linear-gradient(180deg,#202428,#1a1d20)}.trackerGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.trackerTile{min-width:0;aspect-ratio:1/1;border:1px solid #343a40;border-radius:17px;background:#252a2f;color:#f5f1ec;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.trackerIcon{width:58px;height:58px;border-radius:16px;overflow:hidden;background:#b9785b}.trackerIcon img{width:100%;height:100%;object-fit:cover;display:block}.trackerTile strong{font-size:14px}
.quickGrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:9px}.quickCard{min-height:108px;padding:14px;border:1px solid #3a3f44;border-radius:19px;background:#202428;color:#f5f1ec;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between}.quickCard.timestamp{background:linear-gradient(135deg,#4b3a33,#2b2421);border-color:#725344}.quickTop{font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#a89b94}.quickTitle{font-size:24px;font-weight:930;letter-spacing:-.03em;line-height:1}.quickIcon{width:36px;height:36px;color:#d7a17f}.quickIcon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.quickCard.translator{align-items:center;justify-content:center;text-align:center;gap:7px}.quickCard.translator .quickTitle{font-size:13px;letter-spacing:0}.quickCard.translator .quickIcon{width:31px;height:31px}
.monitorCard{min-height:84px;padding:14px 15px;align-items:center;gap:12px}.monitorIcon{width:42px;height:42px;flex:0 0 42px;color:#c99570}.monitorIcon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}.monitorCopy{min-width:0;flex:1}.monitorTitle{font-size:16px;font-weight:900}.monitorMeta{margin-top:4px;color:#8d949a;font-size:10px}.monitorArrow{color:#c99570;font-weight:900}
.quoteCompact{min-height:90px;padding:15px;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#33251f,#211d1b);border-color:#65483b}.quoteCompact strong{font-size:17px}.quoteCompact small{display:block;margin-top:4px;color:#a08f86;font-size:10px}.quoteBadge{width:46px;height:46px;flex:0 0 46px;border-radius:15px;background:#b9785b;color:#17100d;display:grid;place-items:center;font-size:19px;font-weight:950}
@media(max-width:430px){.driverHome{padding-left:12px;padding-right:12px}.driverHero{min-height:116px}.driverHeroTitle{font-size:34px}.trackerGrid{gap:7px}.trackerTile{border-radius:15px}.trackerIcon{width:52px;height:52px}.trackerTile strong{font-size:12px}.quickGrid{gap:7px}.quickCard{min-height:102px;padding:12px}.quickTitle{font-size:21px}}
</style>
<script defer src="assets/mobile.js?v=release20261003_2106"></script>
</head>
<body class="sw-module-page">
<main class="driverHome">
  <div class="driverIntro"><strong>Driver</strong><span>Strumenti operativi</span></div>

  <section class="driverSection">
    <a class="driverCard driverHero" href="cartello.html?release=2026.10.03-2106-driver-layout">
      <span class="driverHeroCopy"><span class="driverEyebrow">Accoglienza cliente</span><span class="driverHeroTitle">CARTELLO</span></span>
      <span class="driverHeroIcon" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="10" y="8" width="44" height="30" rx="4"/><path d="M18 20h28M18 27h20M13 53c3-7 7-12 12-15l7 6-7 9M51 53c-3-7-7-12-12-15l-7 6 7 9"/></svg></span>
    </a>
  </section>

  <section class="driverSection" id="tracker">
    <div class="trackerBox">
      <div class="driverSectionTitle">Tracker</div>
      <div class="trackerGrid">
        <a class="trackerTile" href="voli.html?release=2026.10.03-2106-driver-layout"><span class="trackerIcon"><img src="assets/icon-voli.svg?v=mobile20260930" alt=""></span><strong>Voli</strong></a>
        <a class="trackerTile" href="treni.html?release=2026.10.03-2106-driver-layout"><span class="trackerIcon"><img src="assets/icon-treni.svg?v=2" alt=""></span><strong>Treni</strong></a>
        <a class="trackerTile" href="navi.html?release=2026.10.03-2106-driver-layout"><span class="trackerIcon"><img src="assets/icon-navi.svg?v=mobile20260930" alt=""></span><strong>Navi</strong></a>
      </div>
    </div>
  </section>

  <section class="driverSection">
    <div class="quickGrid">
      <a class="quickCard timestamp" href="timestamp.html?release=2026.10.03-2106-driver-layout">
        <span class="quickTop">Prova no-show</span>
        <span style="display:flex;align-items:end;justify-content:space-between;gap:10px"><span class="quickTitle">Timestamp</span><span class="quickIcon" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="8" y="16" width="48" height="36" rx="7"/><path d="M20 16l4-7h16l4 7"/><circle cx="32" cy="34" r="10"/><path d="M43 43l8 8"/></svg></span></span>
      </a>
      <a class="quickCard translator" href="traduttore.html?release=2026.10.03-2106-driver-layout">
        <span class="quickIcon" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M8 12h28v24H20l-9 8v-8H8zM28 28h28v22H44l-8 7v-7h-8M15 19h14M22 16v6M17 28c5-3 8-7 10-12M39 35h6l6 11M42 42h7"/></svg></span>
        <span class="quickTitle">Traduttore</span>
      </a>
    </div>
  </section>

  <section class="driverSection">
    <a class="driverCard monitorCard" href="monitor.html?release=2026.10.03-2106-driver-layout">
      <span class="monitorIcon" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="8" y="11" width="48" height="37" rx="5"/><path d="M16 38V28M26 38V20M36 38V31M46 38V16M25 54h14"/></svg></span>
      <span class="monitorCopy"><span class="monitorTitle">Monitor viaggi salvati</span><span class="monitorMeta" id="driverSavedMeta">Agenda voli, treni e navi</span></span>
      <span class="monitorArrow">›</span>
    </a>
  </section>

  <section class="driverSection" id="altro">
    <a class="driverCard quoteCompact" data-permission="quote" href="preventivo.html?release=2026.10.03-2106-driver-layout">
      <span><strong>Preventivo rapido</strong><small>Tratta, tariffa, costi e marginalità</small></span><span class="quoteBadge">€</span>
    </a>
  </section>
</main>
<script>
(function(){
 function read(k){try{var x=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(x)?x:[];}catch(e){return [];}}
 var count=read("codriver_monitored_flights_v1").length+read("codriver_monitored_trains_v1").length+read("codriver_monitored_ships_v1").length;
 var el=document.getElementById("driverSavedMeta");if(el)el.textContent=count?count+(count===1?" viaggio salvato":" viaggi salvati"):"Nessun viaggio salvato";
})();
</script>

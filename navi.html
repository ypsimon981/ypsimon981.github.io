<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#090909">
<title>SteerWill · Navi</title>
<link rel="icon" type="image/svg+xml" href="assets/steerwill-icon.svg?v=1">
<style>
:root{--bg:#090909;--panel:#171717;--panel2:#222;--line:#353535;--text:#f7f7f7;--muted:#858585;--yellow:#f3d500}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}
body{min-height:100dvh}
a,button,input,select{-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
.page{width:min(880px,100%);margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{font-size:13px;font-weight:850;letter-spacing:.15em;color:#aaa}
.topActions{display:flex;gap:8px}
.pillLink{min-height:42px;padding:0 14px;border:1px solid #3b3b3b;border-radius:999px;background:#222;color:#fff;text-decoration:none;display:flex;align-items:center;font-size:13px;font-weight:800}
.hero{padding:22px;border:1px solid var(--line);border-radius:24px;background:var(--panel)}
.heroTop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
h1{margin:0;font-size:clamp(40px,8vw,66px);line-height:.94;letter-spacing:-.045em}
.provider{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#777;text-align:right;font-weight:850}
.provider strong{display:block;margin-top:4px;color:#d5d5d5;font-size:11px}
.portSelect{margin-top:18px}
.portSelect label{display:block;margin:0 0 7px;color:#7e7e7e;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.portSelect select{width:100%;height:54px;border:1px solid #3a3a3a;border-radius:16px;background:#101010;color:#fff;padding:0 14px;font-size:16px;font-weight:850;outline:none}
.portSelect select:focus{border-color:#777}
.search{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px}
.search input{min-width:0;height:56px;border:1px solid #3a3a3a;border-radius:16px;background:#0f0f0f;color:#fff;padding:0 16px;font-size:19px;font-weight:800;outline:none}
.search input:focus{border-color:#777}
.search button{height:56px;border:0;border-radius:16px;background:var(--yellow);color:#111;padding:0 18px;font-weight:900}
.filters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.filters button{border:1px solid #393939;background:#242424;color:#ccc;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:850}
.filters button.active{background:#fff;color:#111;border-color:#fff}
.notice{margin-top:12px;color:#777;font-size:11px;line-height:1.35}
.sectionHead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:20px 2px 10px}
.sectionTitle{font-size:12px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:#888}
.count{font-size:11px;color:#696969}
.list{display:grid;gap:11px}
.card{border:1px solid #393939;background:#1c1c1c;border-radius:21px;overflow:hidden}
.cardMain{display:grid;grid-template-columns:1fr auto;gap:14px;padding:17px 18px 14px}
.shipName{font-size:23px;font-weight:930;letter-spacing:-.02em}
.dateLine{margin-top:4px;color:#858585;font-size:12px;font-weight:700}
.dock{text-align:right}
.dock strong{display:block;font-size:21px}
.dock span{color:#777;font-size:9px;text-transform:uppercase;font-weight:850;letter-spacing:.08em}
.times{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #303030;border-bottom:1px solid #303030}
.timeCell{padding:13px 14px;text-align:center;border-right:1px solid #303030}
.timeCell:last-child{border-right:0}
.timeLabel{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:.08em;font-weight:850}
.timeValue{margin-top:4px;font-size:20px;font-weight:920}
.cardActions{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px 15px}
.port{color:#777;font-size:10px}
.follow{border:1px solid #3c3c3c;background:#fff;color:#111;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900}
.follow.followed{background:#18351f;color:#bdeec6;border-color:#315a3b}
.empty{padding:30px 18px;border:1px dashed #373737;border-radius:21px;text-align:center;color:#888}
.empty strong{display:block;color:#ddd;font-size:19px;margin-bottom:6px}
.error{color:#ff9693}
@media(max-width:620px){
 .page{padding:12px 12px calc(18px + env(safe-area-inset-bottom))}
 .hero{padding:19px;border-radius:21px}
 .search{grid-template-columns:1fr}
 .search button{width:100%}
 .heroTop{gap:8px}
 .provider{max-width:110px}
}
</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <div class="brand">STEERWILL · NAVI</div>
    <div class="topActions">
      <a class="pillLink" href="monitor.html">Monitor</a>
      <a class="pillLink" href="index.html">← Home</a>
    </div>
  </div>

  <section class="hero">
    <div class="heroTop">
      <div><h1>Navi</h1></div>
      <div class="provider">Porto<strong id="portName">Civitavecchia</strong></div>
    </div>

    <div class="portSelect">
      <label for="portSelect">Porto crocieristico</label>
      <select id="portSelect">
        <option value="civitavecchia">Civitavecchia (Roma)</option>
        <option value="ancona">Ancona</option>
        <option value="bari">Bari</option>
        <option value="brindisi">Brindisi</option>
        <option value="cagliari">Cagliari</option>
        <option value="catania">Catania</option>
        <option value="genova">Genova</option>
        <option value="laspezia">La Spezia</option>
        <option value="livorno">Livorno</option>
        <option value="messina">Messina</option>
        <option value="napoli">Napoli</option>
        <option value="olbia">Olbia</option>
        <option value="palermo">Palermo</option>
        <option value="portoferraio">Portoferraio</option>
        <option value="ravenna">Ravenna</option>
        <option value="salerno">Salerno</option>
        <option value="savona">Savona</option>
        <option value="siracusa">Siracusa</option>
        <option value="taranto">Taranto</option>
        <option value="trapani">Trapani</option>
        <option value="trieste">Trieste</option>
        <option value="venezia">Venezia</option>
      </select>
    </div>

    <div class="search">
      <input id="shipInput" type="text" placeholder="Es. MSC Seaview" autocomplete="off" spellcheck="false">
      <button id="searchBtn" type="button">Cerca nave</button>
    </div>

    <div class="filters">
      <button id="todayBtn" class="active" type="button">Oggi</button>
      <button id="weekBtn" type="button">Programmazione</button>
    </div>

    <div id="sourceNotice" class="notice">Orari di banchina e attracco da Port Mobility Civitavecchia. Gli orari possono subire variazioni operative.</div>
  </section>

  <div class="sectionHead">
    <div id="sectionTitle" class="sectionTitle">Oggi a Civitavecchia</div>
    <div id="count" class="count"></div>
  </div>

  <div id="list" class="list">
    <div class="empty"><strong>Carico programmazione…</strong></div>
  </div>
</main>

<script src="flight-config.js?v=ships6"></script>
<script>
(function(){
  "use strict";

  var STORAGE_KEY = "codriver_monitored_ships_v1";
  var PORT_KEY = "codriver_ship_port_v1";
  var list = document.getElementById("list");
  var count = document.getElementById("count");
  var sectionTitle = document.getElementById("sectionTitle");
  var shipInput = document.getElementById("shipInput");
  var searchBtn = document.getElementById("searchBtn");
  var todayBtn = document.getElementById("todayBtn");
  var weekBtn = document.getElementById("weekBtn");
  var portSelect = document.getElementById("portSelect");
  var portName = document.getElementById("portName");
  var sourceNotice = document.getElementById("sourceNotice");
  var mode = "today";
  var lastItems = [];
  var selectedPort = localStorage.getItem(PORT_KEY) || "civitavecchia";

  if(!Array.prototype.some.call(portSelect.options,function(o){return o.value===selectedPort;})){
    selectedPort = "civitavecchia";
  }
  portSelect.value = selectedPort;

  function currentPortLabel(){
    var option = portSelect.options[portSelect.selectedIndex];
    return option ? option.text.replace(" (Roma)","") : "Civitavecchia";
  }

  function updatePortHeader(){
    portName.textContent = currentPortLabel();
  }

  function localDateISO(){
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+day;
  }

  function getFollowed(){
    try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");}
    catch(e){return [];}
  }

  function saveFollowed(items){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(items));
  }

  function isFollowed(id){
    return getFollowed().some(function(x){return x.id===id;});
  }

  function formatDate(v){
    if(!v) return "—";
    var d = new Date(v+"T12:00:00");
    if(isNaN(d)) return v;
    return d.toLocaleDateString("it-IT",{weekday:"short",day:"2-digit",month:"short"});
  }

  function escapeHtml(v){
    return String(v==null?"":v)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function render(items){
    lastItems = items || [];
    count.textContent = lastItems.length ? lastItems.length+" navi" : "";

    if(!lastItems.length){
      list.innerHTML = '<div class="empty"><strong>Nessuna nave trovata</strong>Prova la programmazione settimanale oppure cerca il nome della nave.</div>';
      return;
    }

    list.innerHTML = lastItems.map(function(s){
      var followed = isFollowed(s.id);
      return '<article class="card">' +
        '<div class="cardMain">' +
          '<div><div class="shipName">'+escapeHtml(s.name)+'</div><div class="dateLine">'+escapeHtml(formatDate(s.date))+'</div></div>' +
          '<div class="dock"><strong>'+escapeHtml(s.dock||"—")+'</strong><span>Banchina</span></div>' +
        '</div>' +
        '<div class="times">' +
          '<div class="timeCell"><div class="timeLabel">Arrivo</div><div class="timeValue">'+escapeHtml(s.arrival||"—")+'</div></div>' +
          '<div class="timeCell"><div class="timeLabel">Partenza</div><div class="timeValue">'+escapeHtml(s.departure||"—")+'</div></div>' +
        '</div>' +
        '<div class="cardActions"><div class="port">'+escapeHtml(s.port||currentPortLabel())+'</div><button class="follow '+(followed?"followed":"")+'" type="button" data-follow="'+escapeHtml(s.id)+'">'+(followed?"✓ Nel Monitor":"+ Segui")+'</button></div>' +
      '</article>';
    }).join("");

    Array.prototype.forEach.call(document.querySelectorAll("[data-follow]"),function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute("data-follow");
        var item = lastItems.find(function(x){return x.id===id;});
        if(!item) return;
        var followed = getFollowed();
        var ix = followed.findIndex(function(x){return x.id===id;});
        if(ix>=0) followed.splice(ix,1);
        else followed.push(item);
        saveFollowed(followed);
        render(lastItems);
      };
    });
  }

  async function load(params){
    if(!window.STEERWILL_SHIPS_API){
      list.innerHTML = '<div class="empty error"><strong>Servizio non configurato</strong></div>';
      return;
    }

    list.innerHTML = '<div class="empty"><strong>Aggiorno il porto…</strong></div>';
    count.textContent = "";

    var query = Object.assign({},params||{});
    query.port = selectedPort;
    var qs = new URLSearchParams(query);
    try{
      var res = await fetch(window.STEERWILL_SHIPS_API + "?" + qs.toString(),{
        cache:"no-store",
        headers:{"apikey":window.STEERWILL_SUPABASE_PUBLIC_KEY || ""}
      });
      var data = await res.json().catch(function(){return {};});
      if(!res.ok) throw new Error(data.error||"api");

      if(data.connected===false){
        count.textContent = "";
        sourceNotice.textContent = "La fonte dati di questo porto non è disponibile.";
        list.innerHTML = '<div class="empty"><strong>'+escapeHtml(data.port||currentPortLabel())+'</strong>Nessun calendario collegato al momento.</div>';
        return;
      }

      sourceNotice.textContent = data.official
        ? "Fonte ufficiale: " + (data.provider || data.port || currentPortLabel()) + ". Gli orari possono subire variazioni operative."
        : "Calendario pubblico: " + (data.provider || "fonte esterna") + ". Verifica sempre eventuali variazioni operative del porto.";
      var items = Array.isArray(data.items)?data.items:[];
      if(params && params.date && !items.length){
        weekBtn.classList.add("active");
        todayBtn.classList.remove("active");
        sectionTitle.textContent = "Programmazione disponibile";
        return load({});
      }
      render(items);
    }catch(e){
      list.innerHTML = '<div class="empty error"><strong>Dati porto non disponibili</strong>Riprova tra poco.</div>';
    }
  }

  function showToday(){
    mode = "today";
    todayBtn.classList.add("active");
    weekBtn.classList.remove("active");
    shipInput.value = "";
    updatePortHeader();
    sectionTitle.textContent = "Oggi a " + currentPortLabel();
    load({date:localDateISO()});
  }

  function showWeek(){
    mode = "week";
    weekBtn.classList.add("active");
    todayBtn.classList.remove("active");
    shipInput.value = "";
    updatePortHeader();
    sectionTitle.textContent = "Programmazione · " + currentPortLabel();
    load({});
  }

  function search(){
    var q = shipInput.value.trim();
    if(!q){ mode==="today" ? showToday() : showWeek(); return; }
    todayBtn.classList.remove("active");
    weekBtn.classList.remove("active");
    sectionTitle.textContent = "“"+q+"” · " + currentPortLabel();
    load({q:q});
  }

  portSelect.onchange = function(){
    selectedPort = portSelect.value;
    localStorage.setItem(PORT_KEY,selectedPort);
    shipInput.value = "";
    updatePortHeader();
  showToday();
  };

  todayBtn.onclick = showToday;
  weekBtn.onclick = showWeek;
  searchBtn.onclick = search;
  shipInput.addEventListener("keydown",function(e){
    if(e.key==="Enter"){e.preventDefault();search();}
  });

  showToday();
})();
</script>
</body>
</html>

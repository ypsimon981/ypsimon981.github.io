<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SteerWill · Testo cliente</title><link rel="icon" href="assets/steerwill-brush-icon.svg?v=brush20261001"><link rel="stylesheet" href="assets/steerwill-theme.css?v=1"><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f7f7f7;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}.page{max-width:760px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:10px}a{color:#eee}h1{font-size:28px;font-weight:650}.panel{background:#171717;border:1px solid #333;border-radius:14px;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{display:block;font-size:14px;margin:0 0 6px;color:#bbb}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;background:#101010;color:#fff;border:1px solid #444;border-radius:9px;padding:10px;min-width:0}textarea{min-height:90px;resize:vertical}button{padding:12px;border:0;border-radius:10px;background:#fff;color:#111;min-height:44px}.styles{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.styles button{background:#292929;color:#fff;border:1px solid #555}.styles button[aria-pressed=true]{background:#fff;color:#111}#finalText{min-height:180px;margin:10px 0}#copy{width:100%}.feedback{font-size:14px;color:#aaa;margin-top:8px}</style><link rel="stylesheet" href="assets/mobile.css?v=mobile20260930"><script defer src="assets/mobile.js?v=20261003-contextnav"></script>
</head><body><main class="page"><nav class="top"><a href="preventivo.html?v=mobile20260930">Preventivo</a><a href="preventivi-salvati.html?v=mobile20260930">Salvati</a><a href="index.html">Home</a></nav><h1>Testo per il cliente</h1><section class="panel"><div class="styles" aria-label="Tono"><button data-tone="gentile" aria-pressed="true">Gentile</button><button data-tone="professionale" aria-pressed="false">Professionale</button><button data-tone="sintetico" aria-pressed="false">Sintetico</button></div><div class="grid"><div class="wide"><label for="client">Nome cliente</label><input id="client" autocomplete="off"></div><div class="wide"><label for="service">Riepilogo servizio</label><textarea id="service"></textarea></div><div><label for="date">Data servizio</label><input id="date" type="date"></div><div><label for="time">Partenza · opzionale</label><input id="time" type="time"></div><div class="wide"><label for="price">Prezzo e condizioni IVA</label><input id="price" placeholder="Es. 90 € IVA inclusa"></div><div class="wide"><label for="extra">Testo libero</label><textarea id="extra"></textarea></div></div><label for="finalText" style="margin-top:16px">Testo finale · modificabile</label><textarea id="finalText"></textarea><button id="copy">Copia testo</button><div id="feedback" class="feedback" role="status"></div></section></main><script>
(function(){var $=function(id){return document.getElementById(id)},tone='gentile',q={};try{q=JSON.parse(sessionStorage.getItem('steerwill_message_quote_v1')||'{}')||{};}catch(e){}
$('client').value=q.customerName||'';$('service').value=[q.from,q.to].filter(Boolean).join(' → ')+(q.modeLabel?' · '+q.modeLabel:'');$('date').value=q.serviceDate||'';$('time').value=q.departureTime||'';$('price').value=q.priceDisplay||'';
function generate(){var name=$('client').value.trim(),service=$('service').value.trim(),date=$('date').value,time=$('time').value,price=$('price').value.trim(),extra=$('extra').value.trim();var when=(date?new Date(date+'T12:00:00').toLocaleDateString('it-IT'):'')+(time?' alle '+time:'');var lines=[];
if(tone==='gentile'){lines.push('Buongiorno'+(name?' '+name:'')+',');lines.push('le invio il preventivo per il servizio'+(service?': '+service:'.'));if(when)lines.push('Data e partenza: '+when);if(price)lines.push('Il prezzo è di '+price+'.');if(extra)lines.push(extra);lines.push('Resto a disposizione per qualsiasi informazione. Grazie!');}
else if(tone==='professionale'){lines.push(name?'Gentile '+name+',':'Buongiorno,');lines.push('Preventivo servizio NCC'+(service?': '+service:''));if(when)lines.push('Data e partenza: '+when);if(price)lines.push('Importo: '+price);if(extra)lines.push(extra);lines.push('Resto a disposizione per la conferma del servizio.');}
else{if(name)lines.push(name);if(service)lines.push(service);if(when)lines.push(when);if(price)lines.push('Prezzo: '+price);if(extra)lines.push(extra);}
$('finalText').value=lines.join('\n');$('feedback').textContent='';}
['client','service','date','time','price','extra'].forEach(function(id){$(id).addEventListener('input',generate)});document.querySelectorAll('[data-tone]').forEach(function(b){b.onclick=function(){tone=b.dataset.tone;document.querySelectorAll('[data-tone]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});generate()}});
$('copy').onclick=async function(){try{await navigator.clipboard.writeText($('finalText').value);$('feedback').textContent='Copiato. Incolla il testo nell’app che preferisci.';}catch(e){$('finalText').focus();$('finalText').select();$('feedback').textContent=document.execCommand('copy')?'Testo copiato.':'Seleziona il testo e usa Copia.';}};generate();})();
</script></body></html>

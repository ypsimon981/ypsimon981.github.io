<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D0908">
<title>SteerWill · Voli</title>
<link rel="icon" type="image/svg+xml" href="assets/steerwill-brush-icon.svg?v=brush20261001">
<style>
:root{--bg:#090909;--panel:#171717;--panel2:#222;--line:#343434;--text:#f7f7f7;--muted:#8d8d8d;--yellow:#f3d500}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}
body{min-height:100dvh}
a,button,input{-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
.page{width:min(860px,100%);margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{font-size:13px;font-weight:850;letter-spacing:.15em;color:#aaa}
.topActions{display:flex;gap:8px}
.pillLink{min-height:42px;padding:0 14px;border:1px solid #3b3b3b;border-radius:999px;background:#222;color:#fff;text-decoration:none;display:flex;align-items:center;font-size:13px;font-weight:800}
.hero{padding:24px;border:1px solid var(--line);border-radius:26px;background:var(--panel)}
.heroTop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
h1{margin:0;font-size:clamp(40px,8vw,68px);line-height:.94;letter-spacing:-.045em}
.provider{font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:#8d8d8d;text-align:right}
.provider strong{display:block;margin-top:4px;color:#d8d8d8;font-size:12px}
.search{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:22px}
.search input{min-width:0;height:58px;border:1px solid #3b3b3b;border-radius:17px;background:#0e0e0e;color:#fff;padding:0 18px;font-size:22px;font-weight:850;text-transform:uppercase;outline:none}
.search input:focus{border-color:#777}
.search button{height:58px;border:0;border-radius:17px;background:var(--yellow);color:#111;padding:0 20px;font-weight:900}
.dayTabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dayTabs button{height:44px;border:1px solid #3a3a3a;border-radius:14px;background:#232323;color:#cfcfcf;font-weight:900}
.dayTabs button.active{background:#fff;color:#111;border-color:#fff}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick button{border:1px solid #383838;background:#232323;color:#d8d8d8;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800}
.notice{margin-top:13px;padding:10px 12px;border:1px solid #303030;border-radius:13px;background:#121212;color:#858585;font-size:11px;line-height:1.35}
.result{display:none;margin-top:16px;border:1px solid #3b3b3b;border-radius:24px;background:#1c1c1c;overflow:hidden}
.result.show{display:block}
.resultHead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 20px 14px}
.flightIdent{font-size:34px;font-weight:950;letter-spacing:-.03em}
.airline{margin-top:3px;color:#8f8f8f;font-size:13px;font-weight:700}
.badge{padding:7px 10px;border-radius:999px;background:#2b2b2b;border:1px solid #3f3f3f;font-size:11px;font-weight:850}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:12px 20px 20px}
.airportCode{font-size:38px;font-weight:950;letter-spacing:-.03em}
.airportName{margin-top:3px;color:#858585;font-size:11px}
.routeArrow{font-size:28px;color:#767676}
.route .right{text-align:right}
.landingBlock{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:0 20px 18px;padding:16px 17px;border:1px solid #4b4625;border-radius:18px;background:linear-gradient(135deg,#2a2819,#1f211e)}
.landingEyebrow{font-size:9px;color:#a79d62;font-weight:900;letter-spacing:.11em;text-transform:uppercase}
.landingDate{margin-top:5px;font-size:18px;font-weight:900}
.landingTime{font-size:clamp(34px,8vw,54px);font-weight:950;letter-spacing:-.04em;color:#f2c94c;line-height:.9}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #303030;border-bottom:1px solid #303030}
.stat{padding:15px 12px;text-align:center;border-right:1px solid #303030}
.stat:last-child{border-right:0}
.statLabel{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.08em;font-weight:850}
.statValue{margin-top:5px;font-size:17px;font-weight:900}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px 20px}
.actions button{min-height:52px;border-radius:15px;font-weight:900}
.secondary{border:1px solid #3b3b3b;background:#252525;color:#fff}
.primary{border:0;background:#fff;color:#111}
.followed{background:#17351f!important;color:#bff1c8!important}
.empty{padding:22px;color:#8f8f8f;font-size:14px}
@media(max-width:620px){
 .page{padding:12px 12px calc(18px + env(safe-area-inset-bottom))}
 .hero{padding:20px;border-radius:22px}
 .search{grid-template-columns:1fr}
 .search button{width:100%}
 .stats{grid-template-columns:1fr 1fr}
 .stat:nth-child(2){border-right:0}
 .stat:nth-child(-n+2){border-bottom:1px solid #303030}
 .route{gap:10px}
 .airportCode{font-size:32px}
}
</style>
<link rel="stylesheet" href="assets/steerwill-theme.css?v=1">
<link rel="stylesheet" href="assets/revision.css?v=20260930"><link rel="stylesheet" href="assets/mobile.css?v=mobile20260930"><script defer src="assets/mobile.js?v=mobile20260930"></script>
<style>#flightActions{grid-template-columns:repeat(3,minmax(0,1fr))}#flightActions button,#flightActions a{display:flex;align-items:center;justify-content:center;min-width:0;min-height:48px;padding:8px 6px;border-radius:12px;font:inherit;font-size:14px;font-weight:800;text-align:center;text-decoration:none;line-height:1.2}#flightActions .noShowAction{gap:4px;color:#fff}#flightActions svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}#flightActions .noShowAction span{white-space:nowrap}#landingElapsed:empty{display:none}@media(max-width:620px){#flightActions button,#flightActions a{font-size:12px!important}#flightActions svg{width:16px;height:16px}}</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <div class="brand">STEERWILL · VOLI</div>
    <div class="topActions">
      <a class="pillLink" href="monitor.html?v=mobile20260930">Monitor</a>
      <a class="pillLink" href="index.html">← Home</a>
    </div>
  </div>

  <section class="hero">
    <div class="heroTop">
      <div>
        <h1>Monitoraggio voli</h1>
      </div>
      <div class="provider">Provider<strong>FlightAware</strong></div>
    </div>

    <div class="search">
      <input id="flightInput" type="text" placeholder="Es. AZ61" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <button id="searchBtn" type="button">Cerca volo</button>
    </div>
    <div class="dayTabs">
      <button id="todayBtn" class="active" type="button">Oggi</button>
      <button id="tomorrowBtn" type="button">Domani</button>
    </div>
    <div class="quick">
      <button type="button" data-flight="AZ61">AZ61</button>
      <button type="button" data-flight="FR9981">FR9981</button>
    </div>
    <div id="modeNotice" class="notice">Dati live FlightAware attivi. Cerca il numero del volo e aggiungilo al Monitor.</div>
  </section>

  <section id="result" class="result">
    <div class="resultHead">
      <div>
        <div id="ident" class="flightIdent">—</div>
        <div id="airline" class="airline">—</div>
      </div>
      <div id="statusBadge" class="badge">—</div>
    </div>

    <div class="route">
      <div>
        <div id="originCode" class="airportCode">—</div>
        <div id="originName" class="airportName">Origine</div>
      </div>
      <div class="routeArrow">→</div>
      <div class="right">
        <div id="destinationCode" class="airportCode">—</div>
        <div id="destinationName" class="airportName">Destinazione</div>
      </div>
    </div>

    <div class="landingBlock">
      <div>
        <div class="landingEyebrow">Atterraggio previsto</div>
        <div id="landingDate" class="landingDate">—</div>
      </div>
      <div id="landingTime" class="landingTime">—</div>
    </div>

    <div class="stats">
      <div class="stat"><div class="statLabel">Arrivo programmato</div><div id="scheduled" class="statValue">—</div></div>
      <div class="stat"><div class="statLabel">Arrivo stimato</div><div id="estimated" class="statValue">—</div></div>
      <div class="stat"><div class="statLabel">Terminal</div><div id="terminal" class="statValue">—</div></div>
      <div class="stat"><div class="statLabel">Gate</div><div id="gate" class="statValue">—</div></div>
    </div>

    <div id="landingElapsed" class="elapsed"></div><div id="flightActions" class="actions">
      <button id="refreshBtn" class="secondary" type="button">Aggiorna</button>
      <button id="followBtn" class="primary" type="button">Segui nel Monitor</button>
      <a id="timestampLink" class="secondary noShowAction" href="timestamp.html?v=mobile20260930"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></svg><span>No show</span></a>
    </div>
  </section>
</main>

<script src="assets/flight-status.js?v=mobile20260930"></script>
<script src="flight-config.js?v=steerwill2"></script>
<script>
(function(){
  "use strict";

  var STORAGE_KEY = "codriver_monitored_flights_v1";
  var input = document.getElementById("flightInput");
  var result = document.getElementById("result");
  var searchBtn = document.getElementById("searchBtn");
  var refreshBtn = document.getElementById("refreshBtn");
  var followBtn = document.getElementById("followBtn");
  var linkedCustomer=new URLSearchParams(location.search).get("client")||"";
  var todayBtn = document.getElementById("todayBtn");
  var tomorrowBtn = document.getElementById("tomorrowBtn");
  var currentFlight = null;
  var selectedDate = localDateOffset(0);

  function normalizeIdent(v){
    return String(v||"").toUpperCase().replace(/\s+/g,"").trim();
  }

  function localDateOffset(days){
    var d=new Date();
    d.setDate(d.getDate()+days);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }

  function formatTime(v){
    if(!v) return "—";
    var d = new Date(v);
    if(isNaN(d)) return "—";
    return d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  }

  function formatDate(v){
    if(!v) return "—";
    var d=new Date(v);
    if(isNaN(d)) return "—";
    return d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  }

  function formatDateTime(v){
    if(!v) return "—";
    var d=new Date(v);
    if(isNaN(d)) return "—";
    return d.toLocaleDateString("it-IT",{day:"2-digit",month:"short"})+" · "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  }

  function getMonitored(){
    try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");}
    catch(e){return [];}
  }

  function saveMonitored(items){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(items));
  }

  function isFollowed(ident,targetDate){
    return getMonitored().some(function(f){
      return f.ident===ident && String(f.target_date||"")===String(targetDate||"");
    });
  }

  function updateFollowButton(){
    if(!currentFlight) return;
    var followed = isFollowed(currentFlight.ident,currentFlight.target_date);
    followBtn.textContent = followed ? "✓ Nel Monitor" : "Segui nel Monitor";
    followBtn.classList.toggle("followed",followed);
  }

  function render(f){
    f.provider=f.provider||'FlightAware';currentFlight = f; f.customerName=linkedCustomer||f.customerName||"";
    document.getElementById("ident").textContent = f.ident || "—";
    document.getElementById("airline").textContent = f.airline || "—";
    document.getElementById("statusBadge").textContent = f.status || "—";
    document.getElementById("originCode").textContent = (f.origin&&f.origin.code)||"—";
    document.getElementById("originName").textContent = (f.origin&&f.origin.name)||"Origine";
    document.getElementById("destinationCode").textContent = (f.destination&&f.destination.code)||"—";
    document.getElementById("destinationName").textContent = (f.destination&&f.destination.name)||"Destinazione";
    var landing=f.actual_on || f.estimated_on || f.scheduled_on || f.estimated_in || f.scheduled_in;
    document.querySelector(".landingEyebrow").textContent=f.actual_on?"Atterraggio reale":"Atterraggio previsto";
    document.getElementById("landingElapsed").dataset.landing=JSON.stringify(f);
    document.getElementById("timestampLink").href=SWFlight.link(f);
    SWFlight.update();
    document.getElementById("landingDate").textContent = formatDate(landing);
    document.getElementById("landingTime").textContent = formatTime(landing);
    document.getElementById("scheduled").textContent = formatDateTime(f.scheduled_in);
    document.getElementById("estimated").textContent = formatDateTime(landing);
    document.getElementById("terminal").textContent = f.terminal_destination || "—";
    document.getElementById("gate").textContent = f.gate_destination || "—";
    result.classList.add("show");
    updateFollowButton();
  }

  function normalizeApiFlight(data, ident){
    var f = data && data.flight ? data.flight : data;
    if(!f) throw new Error("flight_not_found");
    return {
      ident:f.ident || ident,
      airline:f.airline || "",
      origin:{
        code:(f.origin&&f.origin.code) || "—",
        name:(f.origin&&(f.origin.name||f.origin.city)) || "Origine"
      },
      destination:{
        code:(f.destination&&f.destination.code) || "—",
        name:(f.destination&&(f.destination.name||f.destination.city)) || "Destinazione"
      },
      scheduled_in:f.scheduled_in || null,
      estimated_in:f.estimated_in || null,
      actual_in:f.actual_in || null, actual_on:f.actual_on||null, estimated_on:f.estimated_on||null, scheduled_on:f.scheduled_on||null, cancelled:!!f.cancelled,
      terminal_destination:f.terminal_destination || "—",
      gate_destination:f.gate_destination || "—",
      status:f.status || "—",
      fa_flight_id:f.fa_flight_id || "",
      target_date:f.target_date || (data&&data.target_date) || selectedDate
    };
  }

  async function loadFlight(ident){
    var id = normalizeIdent(ident);
    if(!id) return;
    searchBtn.disabled = true;
    searchBtn.textContent = "Cerco…";

    try{
      if(window.STEERWILL_FLIGHT_API){
        var res = await fetch(window.STEERWILL_FLIGHT_API + "?ident=" + encodeURIComponent(id) + "&date=" + encodeURIComponent(selectedDate),{
          cache:"no-store",
          headers:{"apikey":window.STEERWILL_SUPABASE_PUBLIC_KEY || ""}
        });
        var data = await res.json().catch(function(){return {};});
        if(!res.ok) throw new Error(data.error || "api");
        render(normalizeApiFlight(data,id));
      }else{
        throw new Error("config");
      }
    }catch(e){
      currentFlight = null;
      delete document.getElementById("landingElapsed").dataset.landing;document.getElementById("landingElapsed").textContent="";result.classList.remove("sw-ok","sw-warn","sw-bad");document.getElementById("timestampLink").href=SWFlight.link({ident:id,target_date:selectedDate,customerName:linkedCustomer});
      result.classList.add("show");
      document.getElementById("ident").textContent = id;
      document.getElementById("airline").textContent = "Volo non disponibile";
      document.getElementById("statusBadge").textContent = "Nessun dato";
      document.getElementById("originCode").textContent = "—";
      document.getElementById("originName").textContent = "Origine";
      document.getElementById("destinationCode").textContent = "—";
      document.getElementById("destinationName").textContent = "Destinazione";
      document.getElementById("landingDate").textContent = selectedDate===localDateOffset(1) ? "Domani" : selectedDate===localDateOffset(0)?"Oggi":selectedDate;
      document.getElementById("landingTime").textContent = "—";
      document.getElementById("scheduled").textContent = "—";
      document.getElementById("estimated").textContent = "—";
      document.getElementById("terminal").textContent = "—";
      document.getElementById("gate").textContent = "—";
      followBtn.textContent = "Segui nel Monitor";
      followBtn.classList.remove("followed");
    }finally{
      searchBtn.disabled = false;
      searchBtn.textContent = "Cerca volo";
    }
  }

  function setDay(offset){
    selectedDate=localDateOffset(offset);
    todayBtn.classList.toggle("active",offset===0);
    tomorrowBtn.classList.toggle("active",offset===1);
    if(input.value.trim()) loadFlight(input.value);
  }

  todayBtn.onclick=function(){setDay(0);};
  tomorrowBtn.onclick=function(){setDay(1);};
  searchBtn.onclick = function(){ loadFlight(input.value); };
  refreshBtn.onclick = function(){
    if(currentFlight){
      selectedDate=currentFlight.target_date||selectedDate;
      loadFlight(currentFlight.ident);
    }else loadFlight(input.value);
  };
  input.addEventListener("keydown",function(e){ if(e.key==="Enter"){e.preventDefault();loadFlight(input.value);} });

  Array.prototype.forEach.call(document.querySelectorAll("[data-flight]"),function(btn){
    btn.onclick = function(){
      input.value = btn.getAttribute("data-flight");
      loadFlight(input.value);
    };
  });

  followBtn.onclick = function(){
    if(!currentFlight) return;
    var items = getMonitored();
    var idx = items.findIndex(function(f){
      return f.ident===currentFlight.ident && String(f.target_date||"")===String(currentFlight.target_date||"");
    });
    if(idx >= 0){
      items.splice(idx,1);
    }else{
      var copy = JSON.parse(JSON.stringify(currentFlight));
      copy.followedAt = Date.now(); copy.customerName=currentFlight.customerName||linkedCustomer;
      items.push(copy);
    }
    saveMonitored(items);
    updateFollowButton();
  };

  input.addEventListener("input",function(){
    if(!input.value.trim()) result.classList.remove("show");
  });
var handoff=new URLSearchParams(location.search);if(handoff.get("flight")){input.value=handoff.get("flight");if(/^\d{4}-\d{2}-\d{2}$/.test(handoff.get("date")||""))selectedDate=handoff.get("date");loadFlight(input.value);}
})();
</script>
</body>
</html>

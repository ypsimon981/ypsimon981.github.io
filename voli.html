<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#090909">
<title>CoDriver · Voli</title>
<style>
:root{--bg:#090909;--panel:#171717;--panel2:#222;--line:#343434;--text:#f7f7f7;--muted:#8d8d8d;--yellow:#f3d500}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}
body{min-height:100dvh}
a,button,input{-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
.page{width:min(860px,100%);margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{font-size:13px;font-weight:850;letter-spacing:.15em;color:#aaa}
.topActions{display:flex;gap:8px}
.pillLink{min-height:42px;padding:0 14px;border:1px solid #3b3b3b;border-radius:999px;background:#222;color:#fff;text-decoration:none;display:flex;align-items:center;font-size:13px;font-weight:800}
.hero{padding:24px;border:1px solid var(--line);border-radius:26px;background:var(--panel)}
.heroTop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
h1{margin:0;font-size:clamp(40px,8vw,68px);line-height:.94;letter-spacing:-.045em}
.provider{font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:#8d8d8d;text-align:right}
.provider strong{display:block;margin-top:4px;color:#d8d8d8;font-size:12px}
.search{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:22px}
.search input{min-width:0;height:58px;border:1px solid #3b3b3b;border-radius:17px;background:#0e0e0e;color:#fff;padding:0 18px;font-size:22px;font-weight:850;text-transform:uppercase;outline:none}
.search input:focus{border-color:#777}
.search button{height:58px;border:0;border-radius:17px;background:var(--yellow);color:#111;padding:0 20px;font-weight:900}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.quick button{border:1px solid #383838;background:#232323;color:#d8d8d8;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800}
.notice{margin-top:13px;padding:10px 12px;border:1px solid #303030;border-radius:13px;background:#121212;color:#858585;font-size:11px;line-height:1.35}
.result{display:none;margin-top:16px;border:1px solid #3b3b3b;border-radius:24px;background:#1c1c1c;overflow:hidden}
.result.show{display:block}
.resultHead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 20px 14px}
.flightIdent{font-size:34px;font-weight:950;letter-spacing:-.03em}
.airline{margin-top:3px;color:#8f8f8f;font-size:13px;font-weight:700}
.badge{padding:7px 10px;border-radius:999px;background:#2b2b2b;border:1px solid #3f3f3f;font-size:11px;font-weight:850}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:12px 20px 20px}
.airportCode{font-size:38px;font-weight:950;letter-spacing:-.03em}
.airportName{margin-top:3px;color:#858585;font-size:11px}
.routeArrow{font-size:28px;color:#767676}
.route .right{text-align:right}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #303030;border-bottom:1px solid #303030}
.stat{padding:15px 12px;text-align:center;border-right:1px solid #303030}
.stat:last-child{border-right:0}
.statLabel{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.08em;font-weight:850}
.statValue{margin-top:5px;font-size:17px;font-weight:900}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px 20px}
.actions button{min-height:52px;border-radius:15px;font-weight:900}
.secondary{border:1px solid #3b3b3b;background:#252525;color:#fff}
.primary{border:0;background:#fff;color:#111}
.followed{background:#17351f!important;color:#bff1c8!important}
.empty{padding:22px;color:#8f8f8f;font-size:14px}
@media(max-width:620px){
 .page{padding:12px 12px calc(18px + env(safe-area-inset-bottom))}
 .hero{padding:20px;border-radius:22px}
 .search{grid-template-columns:1fr}
 .search button{width:100%}
 .stats{grid-template-columns:1fr 1fr}
 .stat:nth-child(2){border-right:0}
 .stat:nth-child(-n+2){border-bottom:1px solid #303030}
 .route{gap:10px}
 .airportCode{font-size:32px}
}
</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <div class="brand">CODRIVER · VOLI</div>
    <div class="topActions">
      <a class="pillLink" href="monitor.html">Monitor</a>
      <a class="pillLink" href="index.html">← Home</a>
    </div>
  </div>

  <section class="hero">
    <div class="heroTop">
      <div>
        <h1>Monitoraggio voli</h1>
      </div>
      <div class="provider">Provider<strong>FlightAware</strong></div>
    </div>

    <div class="search">
      <input id="flightInput" type="text" placeholder="Es. AZ61" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <button id="searchBtn" type="button">Cerca volo</button>
    </div>
    <div class="quick">
      <button type="button" data-flight="AZ61">AZ61</button>
      <button type="button" data-flight="FR9981">FR9981</button>
    </div>
    <div id="modeNotice" class="notice">Interfaccia pronta. I dati live verranno letti tramite FlightAware quando colleghiamo il proxy API server-side.</div>
  </section>

  <section id="result" class="result">
    <div class="resultHead">
      <div>
        <div id="ident" class="flightIdent">—</div>
        <div id="airline" class="airline">—</div>
      </div>
      <div id="statusBadge" class="badge">—</div>
    </div>

    <div class="route">
      <div>
        <div id="originCode" class="airportCode">—</div>
        <div id="originName" class="airportName">Origine</div>
      </div>
      <div class="routeArrow">→</div>
      <div class="right">
        <div id="destinationCode" class="airportCode">—</div>
        <div id="destinationName" class="airportName">Destinazione</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="statLabel">Programmato</div><div id="scheduled" class="statValue">—</div></div>
      <div class="stat"><div class="statLabel">Stimato</div><div id="estimated" class="statValue">—</div></div>
      <div class="stat"><div class="statLabel">Terminal</div><div id="terminal" class="statValue">—</div></div>
      <div class="stat"><div class="statLabel">Gate</div><div id="gate" class="statValue">—</div></div>
    </div>

    <div class="actions">
      <button id="refreshBtn" class="secondary" type="button">Aggiorna</button>
      <button id="followBtn" class="primary" type="button">+ Segui nel Monitor</button>
    </div>
  </section>
</main>

<script src="flight-config.js"></script>
<script>
(function(){
  "use strict";

  var STORAGE_KEY = "codriver_monitored_flights_v1";
  var input = document.getElementById("flightInput");
  var result = document.getElementById("result");
  var searchBtn = document.getElementById("searchBtn");
  var refreshBtn = document.getElementById("refreshBtn");
  var followBtn = document.getElementById("followBtn");
  var currentFlight = null;

  function normalizeIdent(v){
    return String(v||"").toUpperCase().replace(/\s+/g,"").trim();
  }

  function todayIsoAt(hour,minute){
    var d = new Date();
    d.setHours(hour,minute,0,0);
    return d.toISOString();
  }

  function demoFlight(ident){
    var id = normalizeIdent(ident);
    if(id === "AZ61"){
      return {
        ident:"AZ61",
        airline:"ITA Airways",
        origin:{code:"MAD",name:"Madrid"},
        destination:{code:"FCO",name:"Roma Fiumicino"},
        scheduled_in:todayIsoAt(12,0),
        estimated_in:todayIsoAt(12,0),
        terminal_destination:"1",
        gate_destination:"—",
        status:"Programmato",
        demo:true
      };
    }
    if(id === "FR9981"){
      return {
        ident:"FR9981",
        airline:"Ryanair",
        origin:{code:"WRO",name:"Wroclaw"},
        destination:{code:"LIS",name:"Lisbona"},
        scheduled_in:todayIsoAt(10,10),
        estimated_in:todayIsoAt(10,10),
        terminal_destination:"—",
        gate_destination:"—",
        status:"Programmato",
        demo:true
      };
    }
    return {
      ident:id || "—",
      airline:"Dati live da collegare",
      origin:{code:"—",name:"Origine"},
      destination:{code:"—",name:"Destinazione"},
      scheduled_in:null,
      estimated_in:null,
      terminal_destination:"—",
      gate_destination:"—",
      status:"In attesa dati",
      demo:true
    };
  }

  function formatTime(v){
    if(!v) return "—";
    var d = new Date(v);
    if(isNaN(d)) return "—";
    return d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  }

  function getMonitored(){
    try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");}
    catch(e){return [];}
  }

  function saveMonitored(items){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(items));
  }

  function isFollowed(ident){
    return getMonitored().some(function(f){return f.ident===ident;});
  }

  function updateFollowButton(){
    if(!currentFlight) return;
    var followed = isFollowed(currentFlight.ident);
    followBtn.textContent = followed ? "✓ Nel Monitor" : "+ Segui nel Monitor";
    followBtn.classList.toggle("followed",followed);
  }

  function render(f){
    currentFlight = f;
    document.getElementById("ident").textContent = f.ident || "—";
    document.getElementById("airline").textContent = f.airline || "—";
    document.getElementById("statusBadge").textContent = f.demo ? (f.status + " · DEMO") : (f.status || "—");
    document.getElementById("originCode").textContent = (f.origin&&f.origin.code)||"—";
    document.getElementById("originName").textContent = (f.origin&&f.origin.name)||"Origine";
    document.getElementById("destinationCode").textContent = (f.destination&&f.destination.code)||"—";
    document.getElementById("destinationName").textContent = (f.destination&&f.destination.name)||"Destinazione";
    document.getElementById("scheduled").textContent = formatTime(f.scheduled_in);
    document.getElementById("estimated").textContent = formatTime(f.estimated_in || f.scheduled_in);
    document.getElementById("terminal").textContent = f.terminal_destination || "—";
    document.getElementById("gate").textContent = f.gate_destination || "—";
    result.classList.add("show");
    updateFollowButton();
  }

  function normalizeApiFlight(data, ident){
    var f = data && data.flight ? data.flight : data;
    if(!f) return demoFlight(ident);
    return {
      ident:f.ident_iata || f.ident || ident,
      airline:f.operator_name || f.operator || "",
      origin:{
        code:(f.origin&&(f.origin.code_iata||f.origin.code)) || f.origin_iata || f.origin || "—",
        name:(f.origin&&(f.origin.name||f.origin.city)) || "Origine"
      },
      destination:{
        code:(f.destination&&(f.destination.code_iata||f.destination.code)) || f.destination_iata || f.destination || "—",
        name:(f.destination&&(f.destination.name||f.destination.city)) || "Destinazione"
      },
      scheduled_in:f.scheduled_in || null,
      estimated_in:f.estimated_in || f.estimated_on || null,
      actual_in:f.actual_in || null,
      terminal_destination:f.terminal_destination || f.terminal_dest || "—",
      gate_destination:f.gate_destination || f.gate_dest || "—",
      status:f.status || (f.cancelled ? "Cancellato" : f.actual_in ? "Arrivato" : f.actual_off ? "In volo" : "Programmato"),
      fa_flight_id:f.fa_flight_id || "",
      demo:false
    };
  }

  async function loadFlight(ident){
    var id = normalizeIdent(ident);
    if(!id) return;
    searchBtn.disabled = true;
    searchBtn.textContent = "Cerco…";

    try{
      if(window.CODRIVER_FLIGHT_API){
        var res = await fetch(window.CODRIVER_FLIGHT_API + "?ident=" + encodeURIComponent(id),{cache:"no-store"});
        if(!res.ok) throw new Error("api");
        var data = await res.json();
        render(normalizeApiFlight(data,id));
      }else{
        render(demoFlight(id));
      }
    }catch(e){
      render(demoFlight(id));
      document.getElementById("statusBadge").textContent = "Dati live non disponibili";
    }finally{
      searchBtn.disabled = false;
      searchBtn.textContent = "Cerca volo";
    }
  }

  searchBtn.onclick = function(){ loadFlight(input.value); };
  refreshBtn.onclick = function(){ if(currentFlight) loadFlight(currentFlight.ident); };
  input.addEventListener("keydown",function(e){ if(e.key==="Enter"){e.preventDefault();loadFlight(input.value);} });

  Array.prototype.forEach.call(document.querySelectorAll("[data-flight]"),function(btn){
    btn.onclick = function(){
      input.value = btn.getAttribute("data-flight");
      loadFlight(input.value);
    };
  });

  followBtn.onclick = function(){
    if(!currentFlight) return;
    var items = getMonitored();
    var idx = items.findIndex(function(f){return f.ident===currentFlight.ident;});
    if(idx >= 0){
      items.splice(idx,1);
    }else{
      var copy = JSON.parse(JSON.stringify(currentFlight));
      copy.followedAt = Date.now();
      items.push(copy);
    }
    saveMonitored(items);
    updateFollowButton();
  };
})();
</script>
</body>
</html>

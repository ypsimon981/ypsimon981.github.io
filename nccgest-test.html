<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1012">
<title>SteerWill · Servizi NCC GEST</title><link rel="stylesheet" href="assets/module-shell.css?v=release20261003_2106"><link rel="stylesheet" href="assets/mobile.css?v=20261003-contextnav2">
<style>
body{background:#0f1012;color:#f5f1ec;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(820px,100%);margin:auto;padding:18px 14px 110px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{color:#d29a72;text-decoration:none;font-weight:800}.muted{color:#8f969c;font-size:12px}.panel,.service{border:1px solid #363c42;background:#1d2125;border-radius:18px;padding:14px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}label{font-size:10px;color:#9da4aa;font-weight:850;text-transform:uppercase;letter-spacing:.08em}input{width:100%;box-sizing:border-box;border:1px solid #41484e;border-radius:12px;background:#15181b;color:#fff;padding:12px;font-size:15px}button{border:0;border-radius:13px;background:#b9785b;color:#17100d;padding:12px 16px;font-weight:900;font-size:14px}.status{margin-top:10px;font-size:12px;color:#aab0b5}.service{display:grid;gap:8px}.serviceHead{display:flex;justify-content:space-between;gap:12px}.time{font-size:22px;font-weight:950}.route{font-size:17px;font-weight:850}.pill{font-size:10px;border:1px solid #4a5157;border-radius:999px;padding:5px 8px;height:max-content;color:#c6ccd0}.details{font-size:12px;color:#b2b8bd;line-height:1.55}.raw{white-space:pre-wrap;word-break:break-word;font:11px ui-monospace,monospace;color:#aeb5ba;max-height:240px;overflow:auto}@media(max-width:520px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><main class="wrap">
<div class="top"><div><div class="muted">SteerWill Driver · test integrazione</div><h1 style="margin:4px 0 0;font-size:25px">Servizi NCC GEST</h1></div><a class="back" href="driver.html">Driver</a></div>
<div class="panel"><div class="grid">
<div class="field full"><label>Token API NCC GEST</label><input id="token" type="password" autocomplete="off" placeholder="Token di test"></div>
<div class="field"><label>Dal</label><input id="from" type="date"></div><div class="field"><label>Al</label><input id="to" type="date"></div>
</div><div style="display:flex;gap:10px;align-items:center;margin-top:12px"><button id="load">Leggi servizi</button><span class="status" id="status">Sola lettura: nessun servizio viene modificato.</span></div></div>
<div id="list"></div><details class="panel" id="debug" hidden><summary>Dati grezzi NCC GEST</summary><pre class="raw" id="raw"></pre></details>
</main><script>
const ENDPOINT="https://bboijzuzhgvfxqrsfatw.supabase.co/functions/v1/nccgest-read", APIKEY="sb_publishable_IYGuSSUStiK95becoD-OQQ_aj_2sGIN";
const $=id=>document.getElementById(id); const today=new Date(); const iso=d=>d.toISOString().slice(0,10); $("from").value=iso(today); $("to").value=iso(today);
const apiDate=v=>{const [y,m,d]=v.split("-");return d+"/"+m+"/"+y}; const pick=(o,...ks)=>{for(const k of ks)if(o&&o[k]!=null&&o[k]!=="")return o[k];return ""};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(items){const list=$("list");list.innerHTML=""; if(!items.length){list.innerHTML='<div class="panel muted">Nessun servizio restituito per questo intervallo.</div>';return}
 items.forEach(s=>{const date=pick(s,"date","service_date"),time=pick(s,"pickup_time","time","hour"),from=pick(s,"pickup","from","departure"),to=pick(s,"dropoff","destination","to"),pax=pick(s,"paxname","passenger","customer_name"),driver=pick(s,"driver","driver_name","internal_driver"),transport=pick(s,"transport_number","flight","train"),status=pick(s,"status"),id=pick(s,"serviceid","id");
 const el=document.createElement("article");el.className="service";el.innerHTML='<div class="serviceHead"><div><div class="time">'+esc(time||date||"Servizio")+'</div><div class="route">'+esc(from||"—")+' → '+esc(to||"—")+'</div></div><span class="pill">'+esc(status||("ID "+id))+'</span></div><div class="details">'+(pax?"Passeggero: <b>"+esc(pax)+"</b><br>":"")+(transport?"Volo/treno: <b>"+esc(transport)+"</b><br>":"")+(driver?"Autista: <b>"+esc(typeof driver==="object"?JSON.stringify(driver):driver)+"</b><br>":"")+(date?"Data: "+esc(date):"")+'</div>';list.appendChild(el)})}
$("load").onclick=async()=>{const token=$("token").value.trim();if(!token){$("status").textContent="Inserisci il token API.";return} sessionStorage.setItem("sw_nccgest_test_token",token); $("status").textContent="Lettura in corso…"; $("load").disabled=true;
 try{const u=new URL(ENDPOINT);u.searchParams.set("start_date",apiDate($("from").value));u.searchParams.set("end_date",apiDate($("to").value));const r=await fetch(u,{headers:{apikey:APIKEY,"x-nccgest-token":token}});const j=await r.json();$("raw").textContent=JSON.stringify(j,null,2);$("debug").hidden=false;if(!r.ok||j.success===false)throw new Error(j.error||j.message||"Errore NCC GEST");const items=Array.isArray(j.data)?j.data:(Array.isArray(j)?j:[]);render(items);$("status").textContent=items.length+" servizi letti da NCC GEST."}catch(e){$("status").textContent="Errore: "+e.message;render([])}finally{$("load").disabled=false}};
const saved=sessionStorage.getItem("sw_nccgest_test_token");if(saved)$("token").value=saved;
</script></body></html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#090909">
<title>CoDriver · Monitor</title>
<style>
:root{--bg:#090909;--panel:#171717;--panel2:#222;--line:#343434;--text:#f7f7f7;--muted:#8d8d8d;--yellow:#f3d500}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}
body{min-height:100dvh}
a,button{-webkit-tap-highlight-color:transparent}
button{font:inherit}
.page{width:min(860px,100%);margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{font-size:13px;font-weight:850;letter-spacing:.15em;color:#aaa}
.topActions{display:flex;gap:8px}
.pillLink{min-height:42px;padding:0 14px;border:1px solid #3b3b3b;border-radius:999px;background:#222;color:#fff;text-decoration:none;display:flex;align-items:center;font-size:13px;font-weight:800}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}
h1{margin:0;font-size:clamp(40px,8vw,66px);line-height:.94;letter-spacing:-.045em}
.subtitle{margin:7px 0 0;color:#888;font-size:14px}
.refresh{min-height:46px;border:1px solid #3b3b3b;border-radius:15px;background:#222;color:#fff;padding:0 14px;font-weight:850}
.notice{margin-bottom:14px;padding:10px 12px;border:1px solid #303030;border-radius:13px;background:#121212;color:#858585;font-size:11px;line-height:1.35}
.list{display:grid;gap:12px}
.card{border:1px solid #393939;border-radius:22px;background:#1c1c1c;overflow:hidden}
.cardHead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px 18px 12px}
.ident{font-size:30px;font-weight:950;letter-spacing:-.03em}
.airline{margin-top:3px;color:#868686;font-size:12px;font-weight:700}
.status{padding:7px 10px;border-radius:999px;border:1px solid #3f3f3f;background:#292929;font-size:10px;font-weight:850;white-space:nowrap}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:0 18px 14px}
.code{font-size:28px;font-weight:950}
.line{height:1px;background:#444;position:relative}
.line:after{content:"";position:absolute;right:0;top:-3px;border-left:6px solid #777;border-top:3px solid transparent;border-bottom:3px solid transparent}
.times{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #303030;border-bottom:1px solid #303030}
.cell{padding:13px 10px;text-align:center;border-right:1px solid #303030}
.cell:last-child{border-right:0}
.cellLabel{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:.08em;font-weight:850}
.cellValue{margin-top:4px;font-size:16px;font-weight:900}
.delay{color:#f0c94f}
.cardActions{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px 16px}
.meta{color:#777;font-size:10px}
.remove{border:1px solid #3b3b3b;background:#252525;color:#bbb;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800}
.empty{padding:30px 20px;border:1px dashed #373737;border-radius:22px;text-align:center;color:#8c8c8c}
.empty strong{display:block;color:#ddd;font-size:20px;margin-bottom:6px}
.empty a{display:inline-flex;margin-top:14px;min-height:44px;align-items:center;padding:0 14px;border-radius:14px;background:#fff;color:#111;text-decoration:none;font-weight:850}
@media(max-width:620px){
 .page{padding:12px 12px calc(18px + env(safe-area-inset-bottom))}
 .head{align-items:flex-start}
 .times{grid-template-columns:1fr 1fr}
 .cell:nth-child(2){border-right:0}
 .cell:nth-child(-n+2){border-bottom:1px solid #303030}
}
</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <div class="brand">CODRIVER · MONITOR</div>
    <div class="topActions">
      <a class="pillLink" href="voli.html">+ Volo</a>
      <a class="pillLink" href="index.html">← Home</a>
    </div>
  </div>

  <div class="head">
    <div>
      <h1>I miei voli</h1>
      <p class="subtitle">I voli che stai seguendo, tutti insieme.</p>
    </div>
    <button id="refreshAll" class="refresh" type="button">Aggiorna</button>
  </div>

  <div id="modeNotice" class="notice">Monitor pronto. In modalità demo i voli restano salvati sul dispositivo; con il collegamento FlightAware verranno aggiornati automaticamente.</div>
  <div id="list" class="list"></div>
</main>

<script src="flight-config.js"></script>
<script>
(function(){
  "use strict";
  var STORAGE_KEY = "codriver_monitored_flights_v1";
  var list = document.getElementById("list");
  var refreshAll = document.getElementById("refreshAll");

  function getItems(){
    try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");}
    catch(e){return [];}
  }

  function saveItems(items){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(items));
  }

  function formatTime(v){
    if(!v) return "—";
    var d = new Date(v);
    if(isNaN(d)) return "—";
    return d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  }

  function delayMinutes(f){
    if(!f.scheduled_in || !f.estimated_in) return null;
    var a = new Date(f.scheduled_in).getTime();
    var b = new Date(f.estimated_in).getTime();
    if(isNaN(a)||isNaN(b)) return null;
    return Math.round((b-a)/60000);
  }

  function escapeHtml(v){
    return String(v==null?"":v)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function render(){
    var items = getItems();
    if(!items.length){
      list.innerHTML = '<div class="empty"><strong>Nessun volo seguito</strong>Aggiungi un volo e comparirà qui.<br><a href="voli.html">Cerca un volo</a></div>';
      return;
    }

    items.sort(function(a,b){
      return new Date(a.estimated_in||a.scheduled_in||0) - new Date(b.estimated_in||b.scheduled_in||0);
    });

    list.innerHTML = items.map(function(f){
      var delay = delayMinutes(f);
      var delayText = delay===null ? "—" : (delay>0 ? "+"+delay+" min" : delay<0 ? delay+" min" : "In orario");
      var origin = f.origin||{};
      var destination = f.destination||{};
      return '<article class="card" data-ident="'+escapeHtml(f.ident)+'">' +
        '<div class="cardHead">' +
          '<div><div class="ident">'+escapeHtml(f.ident||"—")+'</div><div class="airline">'+escapeHtml(f.airline||"")+'</div></div>' +
          '<div class="status">'+escapeHtml((f.status||"—") + (f.demo ? " · DEMO" : ""))+'</div>' +
        '</div>' +
        '<div class="route"><div class="code">'+escapeHtml(origin.code||"—")+'</div><div class="line"></div><div class="code">'+escapeHtml(destination.code||"—")+'</div></div>' +
        '<div class="times">' +
          '<div class="cell"><div class="cellLabel">Programmato</div><div class="cellValue">'+formatTime(f.scheduled_in)+'</div></div>' +
          '<div class="cell"><div class="cellLabel">Stimato</div><div class="cellValue">'+formatTime(f.estimated_in||f.scheduled_in)+'</div></div>' +
          '<div class="cell"><div class="cellLabel">Ritardo</div><div class="cellValue '+(delay>0?"delay":"")+'">'+delayText+'</div></div>' +
          '<div class="cell"><div class="cellLabel">Terminal</div><div class="cellValue">'+escapeHtml(f.terminal_destination||"—")+'</div></div>' +
        '</div>' +
        '<div class="cardActions"><div class="meta">Gate '+escapeHtml(f.gate_destination||"—")+'</div><button class="remove" type="button" data-remove="'+escapeHtml(f.ident)+'">Rimuovi</button></div>' +
      '</article>';
    }).join("");

    Array.prototype.forEach.call(document.querySelectorAll("[data-remove]"),function(btn){
      btn.onclick = function(){
        var ident = btn.getAttribute("data-remove");
        saveItems(getItems().filter(function(f){return f.ident!==ident;}));
        render();
      };
    });
  }

  function normalizeApiFlight(data, old){
    var f = data && data.flight ? data.flight : data;
    if(!f) return old;
    return {
      ident:f.ident_iata || f.ident || old.ident,
      airline:f.operator_name || f.operator || old.airline || "",
      origin:{
        code:(f.origin&&(f.origin.code_iata||f.origin.code)) || f.origin_iata || f.origin || (old.origin&&old.origin.code) || "—",
        name:(f.origin&&(f.origin.name||f.origin.city)) || (old.origin&&old.origin.name) || "Origine"
      },
      destination:{
        code:(f.destination&&(f.destination.code_iata||f.destination.code)) || f.destination_iata || f.destination || (old.destination&&old.destination.code) || "—",
        name:(f.destination&&(f.destination.name||f.destination.city)) || (old.destination&&old.destination.name) || "Destinazione"
      },
      scheduled_in:f.scheduled_in || old.scheduled_in || null,
      estimated_in:f.estimated_in || f.estimated_on || old.estimated_in || null,
      actual_in:f.actual_in || null,
      terminal_destination:f.terminal_destination || f.terminal_dest || old.terminal_destination || "—",
      gate_destination:f.gate_destination || f.gate_dest || old.gate_destination || "—",
      status:f.status || (f.cancelled ? "Cancellato" : f.actual_in ? "Arrivato" : f.actual_off ? "In volo" : "Programmato"),
      fa_flight_id:f.fa_flight_id || old.fa_flight_id || "",
      followedAt:old.followedAt || Date.now(),
      demo:false
    };
  }

  async function refresh(){
    var items = getItems();
    if(!items.length || !window.CODRIVER_FLIGHT_API){ render(); return; }

    refreshAll.disabled = true;
    refreshAll.textContent = "Aggiorno…";

    var updated = [];
    for(var i=0;i<items.length;i++){
      var old = items[i];
      try{
        var res = await fetch(window.CODRIVER_FLIGHT_API + "?ident=" + encodeURIComponent(old.ident),{cache:"no-store"});
        if(!res.ok) throw new Error("api");
        var data = await res.json();
        updated.push(normalizeApiFlight(data,old));
      }catch(e){
        updated.push(old);
      }
    }

    saveItems(updated);
    refreshAll.disabled = false;
    refreshAll.textContent = "Aggiorna";
    render();
  }

  refreshAll.onclick = refresh;
  render();

  if(window.CODRIVER_FLIGHT_API){
    refresh();
    setInterval(refresh,60000);
  }
})();
</script>
</body>
</html>

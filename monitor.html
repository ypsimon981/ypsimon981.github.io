<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#090909">
<title>CoDriver · Monitor</title>
<style>
:root{--bg:#090909;--panel:#171717;--line:#353535;--text:#f7f7f7;--muted:#858585;--yellow:#f3d500}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}
body{min-height:100dvh}
a,button{-webkit-tap-highlight-color:transparent}
button{font:inherit}
.page{width:min(880px,100%);margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{font-size:13px;font-weight:850;letter-spacing:.15em;color:#aaa}
.topActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pillLink{min-height:42px;padding:0 13px;border:1px solid #3b3b3b;border-radius:999px;background:#222;color:#fff;text-decoration:none;display:flex;align-items:center;font-size:12px;font-weight:800}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px}
h1{margin:0;font-size:clamp(40px,8vw,66px);line-height:.94;letter-spacing:-.045em}
.subtitle{margin:7px 0 0;color:#888;font-size:14px}
.refresh{min-height:46px;border:1px solid #3b3b3b;border-radius:15px;background:#222;color:#fff;padding:0 14px;font-weight:850}
.notice{margin-bottom:14px;padding:10px 12px;border:1px solid #303030;border-radius:13px;background:#121212;color:#7f7f7f;font-size:11px;line-height:1.35}
.list{display:grid;gap:12px}
.card{border:1px solid #393939;border-radius:22px;background:#1c1c1c;overflow:hidden}
.cardHead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px 18px 12px}
.ident{font-size:29px;font-weight:950;letter-spacing:-.03em}
.secondaryText{margin-top:3px;color:#888;font-size:12px;font-weight:700}
.badge{padding:7px 10px;border-radius:999px;border:1px solid #414141;background:#292929;font-size:10px;font-weight:900;white-space:nowrap}
.badge.ship{background:#3a340c;color:#f6dc58;border-color:#5e5312}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:0 18px 14px}
.code{font-size:27px;font-weight:950}
.line{height:1px;background:#444;position:relative}
.line:after{content:"";position:absolute;right:0;top:-3px;border-left:6px solid #777;border-top:3px solid transparent;border-bottom:3px solid transparent}
.shipRoute{padding:0 18px 14px;color:#bababa;font-size:14px;font-weight:800}
.times{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #303030;border-bottom:1px solid #303030}
.cell{padding:13px 10px;text-align:center;border-right:1px solid #303030}
.cell:last-child{border-right:0}
.cellLabel{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:.08em;font-weight:850}
.cellValue{margin-top:4px;font-size:16px;font-weight:900}
.delay{color:#f0c94f}
.cardActions{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px 16px}
.meta{color:#777;font-size:10px}
.remove{border:1px solid #3b3b3b;background:#252525;color:#bbb;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800}
.empty{padding:30px 20px;border:1px dashed #373737;border-radius:22px;text-align:center;color:#8c8c8c}
.empty strong{display:block;color:#ddd;font-size:20px;margin-bottom:6px}
.emptyActions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.empty a{display:inline-flex;min-height:44px;align-items:center;padding:0 14px;border-radius:14px;background:#fff;color:#111;text-decoration:none;font-weight:850;font-size:12px}
@media(max-width:620px){
 .page{padding:12px 12px calc(18px + env(safe-area-inset-bottom))}
 .head{align-items:flex-start}
 .times{grid-template-columns:1fr 1fr}
 .cell:nth-child(2){border-right:0}
 .cell:nth-child(-n+2){border-bottom:1px solid #303030}
 .topActions .pillLink:first-child,.topActions .pillLink:nth-child(2){display:none}
}
</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <div class="brand">CODRIVER · MONITOR</div>
    <div class="topActions">
      <a class="pillLink" href="voli.html">+ Volo</a>
      <a class="pillLink" href="navi.html">+ Nave</a>
      <a class="pillLink" href="index.html">← Home</a>
    </div>
  </div>

  <div class="head">
    <div>
      <h1>I miei viaggi</h1>
      <p class="subtitle">Voli e navi che stai seguendo.</p>
    </div>
    <button id="refreshAll" class="refresh" type="button">Aggiorna</button>
  </div>

  <div class="notice">Voli: dati live FlightAware. Navi: programmazione ufficiale di banchina del porto di Civitavecchia.</div>
  <div id="list" class="list"></div>
</main>

<script src="flight-config.js"></script>
<script>
(function(){
  "use strict";

  var FLIGHT_KEY = "codriver_monitored_flights_v1";
  var SHIP_KEY = "codriver_monitored_ships_v1";
  var list = document.getElementById("list");
  var refreshAll = document.getElementById("refreshAll");

  function read(key){
    try{return JSON.parse(localStorage.getItem(key)||"[]");}
    catch(e){return [];}
  }
  function write(key,items){localStorage.setItem(key,JSON.stringify(items));}

  function formatTime(v){
    if(!v) return "—";
    var d = new Date(v);
    if(isNaN(d)) return "—";
    return d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  }

  function formatDate(v){
    if(!v) return "—";
    var d = new Date(v+"T12:00:00");
    if(isNaN(d)) return v;
    return d.toLocaleDateString("it-IT",{weekday:"short",day:"2-digit",month:"short"});
  }

  function delayMinutes(f){
    if(!f.scheduled_in || !f.estimated_in) return null;
    var a = new Date(f.scheduled_in).getTime();
    var b = new Date(f.estimated_in).getTime();
    if(isNaN(a)||isNaN(b)) return null;
    return Math.round((b-a)/60000);
  }

  function escapeHtml(v){
    return String(v==null?"":v)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function sortTime(item){
    if(item.kind==="flight"){
      return new Date(item.data.estimated_in||item.data.scheduled_in||0).getTime()||0;
    }
    var s=item.data;
    return new Date((s.date||"1970-01-01")+"T"+(s.arrival||s.departure||"23:59")+":00").getTime()||0;
  }

  function flightCard(f){
    var delay=delayMinutes(f);
    var delayText=delay===null?"—":(delay>0?"+"+delay+" min":delay<0?delay+" min":"In orario");
    var origin=f.origin||{}, destination=f.destination||{};
    return '<article class="card">'+
      '<div class="cardHead">'+
        '<div><div class="ident">'+escapeHtml(f.ident||"—")+'</div><div class="secondaryText">'+escapeHtml(f.airline||"")+'</div></div>'+
        '<div class="badge">VOLO · '+escapeHtml(f.status||"—")+'</div>'+
      '</div>'+
      '<div class="route"><div class="code">'+escapeHtml(origin.code||"—")+'</div><div class="line"></div><div class="code">'+escapeHtml(destination.code||"—")+'</div></div>'+
      '<div class="times">'+
        '<div class="cell"><div class="cellLabel">Programmato</div><div class="cellValue">'+formatTime(f.scheduled_in)+'</div></div>'+
        '<div class="cell"><div class="cellLabel">Stimato</div><div class="cellValue">'+formatTime(f.estimated_in||f.scheduled_in)+'</div></div>'+
        '<div class="cell"><div class="cellLabel">Ritardo</div><div class="cellValue '+(delay>0?"delay":"")+'">'+delayText+'</div></div>'+
        '<div class="cell"><div class="cellLabel">Terminal</div><div class="cellValue">'+escapeHtml(f.terminal_destination||"—")+'</div></div>'+
      '</div>'+
      '<div class="cardActions"><div class="meta">Gate '+escapeHtml(f.gate_destination||"—")+'</div><button class="remove" type="button" data-remove-flight="'+escapeHtml(f.ident)+'">Rimuovi</button></div>'+
    '</article>';
  }

  function shipCard(s){
    return '<article class="card">'+
      '<div class="cardHead">'+
        '<div><div class="ident">'+escapeHtml(s.name||"—")+'</div><div class="secondaryText">'+escapeHtml(formatDate(s.date))+'</div></div>'+
        '<div class="badge ship">NAVE · PROGRAMMA</div>'+
      '</div>'+
      '<div class="shipRoute">Civitavecchia · Banchina '+escapeHtml(s.dock||"—")+'</div>'+
      '<div class="times">'+
        '<div class="cell"><div class="cellLabel">Arrivo</div><div class="cellValue">'+escapeHtml(s.arrival||"—")+'</div></div>'+
        '<div class="cell"><div class="cellLabel">Partenza</div><div class="cellValue">'+escapeHtml(s.departure||"—")+'</div></div>'+
        '<div class="cell"><div class="cellLabel">Banchina</div><div class="cellValue">'+escapeHtml(s.dock||"—")+'</div></div>'+
        '<div class="cell"><div class="cellLabel">Porto</div><div class="cellValue">CIV</div></div>'+
      '</div>'+
      '<div class="cardActions"><div class="meta">Port Mobility Civitavecchia</div><button class="remove" type="button" data-remove-ship="'+escapeHtml(s.id)+'">Rimuovi</button></div>'+
    '</article>';
  }

  function render(){
    var flights=read(FLIGHT_KEY).map(function(x){return {kind:"flight",data:x};});
    var ships=read(SHIP_KEY).map(function(x){return {kind:"ship",data:x};});
    var items=flights.concat(ships);

    if(!items.length){
      list.innerHTML='<div class="empty"><strong>Nessun viaggio seguito</strong>Aggiungi un volo o una nave e comparirà qui.<div class="emptyActions"><a href="voli.html">+ Volo</a><a href="navi.html">+ Nave</a></div></div>';
      return;
    }

    items.sort(function(a,b){return sortTime(a)-sortTime(b);});
    list.innerHTML=items.map(function(item){
      return item.kind==="flight" ? flightCard(item.data) : shipCard(item.data);
    }).join("");

    Array.prototype.forEach.call(document.querySelectorAll("[data-remove-flight]"),function(btn){
      btn.onclick=function(){
        var ident=btn.getAttribute("data-remove-flight");
        write(FLIGHT_KEY,read(FLIGHT_KEY).filter(function(f){return f.ident!==ident;}));
        render();
      };
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-remove-ship]"),function(btn){
      btn.onclick=function(){
        var id=btn.getAttribute("data-remove-ship");
        write(SHIP_KEY,read(SHIP_KEY).filter(function(s){return s.id!==id;}));
        render();
      };
    });
  }

  function normalizeFlight(data,old){
    var f=data&&data.flight?data.flight:data;
    if(!f) return old;
    return {
      ident:f.ident||old.ident,
      airline:f.airline||old.airline||"",
      origin:{
        code:(f.origin&&f.origin.code)||(old.origin&&old.origin.code)||"—",
        name:(f.origin&&(f.origin.name||f.origin.city))||(old.origin&&old.origin.name)||"Origine"
      },
      destination:{
        code:(f.destination&&f.destination.code)||(old.destination&&old.destination.code)||"—",
        name:(f.destination&&(f.destination.name||f.destination.city))||(old.destination&&old.destination.name)||"Destinazione"
      },
      scheduled_in:f.scheduled_in||old.scheduled_in||null,
      estimated_in:f.estimated_in||old.estimated_in||null,
      actual_in:f.actual_in||null,
      terminal_destination:f.terminal_destination||old.terminal_destination||"—",
      gate_destination:f.gate_destination||old.gate_destination||"—",
      status:f.status||old.status||"—",
      fa_flight_id:f.fa_flight_id||old.fa_flight_id||"",
      followedAt:old.followedAt||Date.now()
    };
  }

  async function refreshFlights(){
    var items=read(FLIGHT_KEY);
    if(!items.length||!window.CODRIVER_FLIGHT_API) return;

    var updated=[];
    for(var i=0;i<items.length;i++){
      var old=items[i];
      try{
        var res=await fetch(window.CODRIVER_FLIGHT_API+"?ident="+encodeURIComponent(old.ident),{
          cache:"no-store",
          headers:{"apikey":window.CODRIVER_SUPABASE_PUBLIC_KEY||""}
        });
        var data=await res.json().catch(function(){return {};});
        if(!res.ok) throw new Error(data.error||"api");
        updated.push(normalizeFlight(data,old));
      }catch(e){updated.push(old);}
    }
    write(FLIGHT_KEY,updated);
  }

  async function refreshShips(){
    var followed=read(SHIP_KEY);
    if(!followed.length||!window.CODRIVER_SHIPS_API) return;

    try{
      var res=await fetch(window.CODRIVER_SHIPS_API,{
        cache:"no-store",
        headers:{"apikey":window.CODRIVER_SUPABASE_PUBLIC_KEY||""}
      });
      var data=await res.json().catch(function(){return {};});
      if(!res.ok||!Array.isArray(data.items)) return;

      var updated=followed.map(function(old){
        var match=data.items.find(function(x){
          return x.date===old.date && String(x.name||"").toUpperCase()===String(old.name||"").toUpperCase();
        });
        if(!match) return old;
        match.id=old.id;
        return match;
      });
      write(SHIP_KEY,updated);
    }catch(e){}
  }

  async function refresh(){
    refreshAll.disabled=true;
    refreshAll.textContent="Aggiorno…";
    await Promise.all([refreshFlights(),refreshShips()]);
    refreshAll.disabled=false;
    refreshAll.textContent="Aggiorna";
    render();
  }

  refreshAll.onclick=refresh;
  render();
  refresh();

  setInterval(async function(){
    await refreshFlights();
    render();
  },60000);
})();
</script>
</body>
</html>
